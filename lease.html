<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lease Info &amp; Documents</title>
<style>
  :root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2733;--soft:#5b6472;--line:#e3e8ef;--brand:#2f6fed;--brand-wash:#eef3fe;--ok:#1f9d6b;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 130px}
  .top,.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .top h1{margin:0 0 6px;font-size:23px;line-height:1.25}
  .top .sub{color:var(--soft);font-size:14px}
  .badge{display:inline-block;background:var(--brand-wash);color:var(--brand);font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;margin-bottom:11px;letter-spacing:.04em;text-transform:uppercase}
  .sec h2{margin:0 0 4px;font-size:17px}
  .sec .note{color:var(--soft);font-size:13.5px;margin:0 0 16px}
  .f{margin-bottom:15px}
  .f>label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .f .hint{font-weight:400;color:var(--soft);font-size:12.5px;display:block;margin-top:2px}
  .f input,.f select,.f textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff;color:var(--ink)}
  .f input:focus,.f select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .yn{display:flex;gap:9px}
  .yn button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;color:var(--soft)}
  .yn button.sel{border-color:var(--brand);background:var(--brand-wash);color:var(--brand)}
  .yn button.sel.no{border-color:#d99;background:#fdecec;color:#9b2c2c}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;
        padding:11px 14px;font-size:15px;cursor:pointer;background:#fff;user-select:none;font-weight:600;color:var(--soft)}
  .chip.sel{border-color:var(--ok);background:#e9f7f0;color:#136c47}
  .secure{background:#f7fbf8;border:1px solid #cfe8db;border-radius:12px;padding:14px;margin-bottom:15px}
  .secure .lock{font-size:12.5px;color:#137a52;font-weight:700;margin-bottom:9px;display:flex;gap:6px;align-items:center}
  .doc{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .doc.done{border-color:#b7e4cd;background:#f6fcf9}
  .doc .dt{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc .nm{font-weight:600;font-size:14.5px}
  .doc .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:#f1eef4;color:#7c7288;white-space:nowrap}
  .doc.done .st{background:#e4f6ee;color:#137a52}
  .doc .why{color:var(--soft);font-size:12.5px;margin-top:3px}
  .up{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .up input[type=file]{display:none}
  .upbtn{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:9px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .up input[type=date]{padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:center;box-shadow:0 -2px 12px rgba(20,22,40,.06)}
  .bar .inner{max-width:720px;width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px 26px;font:inherit;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.55}
  .prog{font-size:13px;color:var(--soft)}
  .msg{text-align:center;padding:52px 22px}
  .check{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
  .err{background:#fdecec;border:1px solid #f5c2c2;color:#9b2c2c;border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:none}
  .lang{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;gap:2px;
        padding:8px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
  .lang button{border:1px solid var(--line);background:#fff;color:var(--soft);font:inherit;
               font-size:13px;font-weight:700;padding:6px 13px;cursor:pointer}
  .lang button:first-of-type{border-radius:9px 0 0 9px}
  .lang button:last-of-type{border-radius:0 9px 9px 0;border-left:0}
  .lang button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  @media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

  /* ---- Touch sizing. Drivers are on phones, not desktops. ----
     16px on form controls: below that, iOS zooms the page the moment a field is
     focused, which throws the layout around mid-answer.
     44px minimum on tap targets: Apple's guideline, and about right for a thumb. */
  input,select,textarea,button{font-size:16px}
  .lang button{min-height:44px;padding-left:16px;padding-right:16px}
  .yn button{min-height:48px}
  .chip{min-height:44px}
  .btn{min-height:48px}
  .f input,.f select,.f textarea{font-size:16px;min-height:48px}
  .up input[type=date]{font-size:16px;min-height:44px}
  .upbtn{min-height:44px;display:inline-flex;align-items:center}
</style>
</head>
<body>

<div class="bar" id="bar" style="display:none"><div class="inner">

let lang=(navigator.language||"en").toLowerCase().startsWith("es")?"es":"en";
try{ const sv=localStorage.getItem("tt_lang"); if(sv) lang=sv; }catch(e){}
const t=(k,vars)=>{ let v=(T[lang]&&T[lang][k])||T.en[k]||""; if(vars) for(const [a,b] of Object.entries(vars)) v=v.split("{"+a+"}").join(b); return v; };


function stateOpts(sel){ return `<option value="">${t("dash")}</option>`+STATES.map(s=>`<option${s===sel?" selected":""}>${s}</option>`).join(""); }
function ynField(key,label,hint){
  return `<div class="f"><label>${label}${hint?`<span class="hint">${hint}</span>`:""}</label>
    <div class="yn" data-yn="${key}"><button type="button" data-v="1">${t("yes")}</button><button type="button" data-v="0">${t("no")}</button></div></div>`;
}
function wireYN(root){
  root.querySelectorAll("[data-yn]").forEach(g=>{
    const key=g.dataset.yn;
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      A[key]=b.dataset.v==="1"?1:0;
      g.querySelectorAll("button").forEach(x=>x.classList.remove("sel","no"));
      b.classList.add("sel"); if(b.dataset.v==="0")b.classList.add("no");
      reflect();
    });
    if(A[key]!=null){ const b=g.querySelector(`[data-v="${A[key]}"]`); if(b){b.classList.add("sel"); if(A[key]===0)b.classList.add("no");} }
  });
}
// The plate program is what makes the title and the 2290 necessary — say so
// where the driver is actually making the choice.
function reflect(){
  const m=$("#plateNote");
  if(m) m.style.display=A.wants_carrier_plates===1?"block":"none";
  const mt=$("#maintFields");
  if(mt) mt.style.display=A.wants_maintenance===1?"grid":"none";
  const bz=$("#bizFields");
  if(bz) bz.style.display=A.has_business===1?"block":"none";
  const done=DOCS.filter(d=>d.status==="received").length;
  const p=$("#prog");
  if(p) p.textContent=DOCS.length?t("prog",{done,total:DOCS.length}):"";
}

function docCard(d){
  const why={
    registration:t("d_reg"),
    title:t("d_title"),
    form_2290:t("d_2290"),
    ecm_photo:t("d_ecm"),
    inspection:t("d_insp"),
    voided_check:t("d_check"),
    form_1099:t("d_1099"),
    lease_form:t("d_lease"),
  }[d.kind]||"";
  const done=d.status==="received";
  if(d.kind==="lease_form") return "";
  return `<div class="doc${done?" done":""}" data-doc="${d.id}">
    <div class="dt"><div><div class="nm">${esc(d.label||d.kind)}</div>${why?`<div class="why">${esc(why)}</div>`:""}</div>
      <span class="st">${done?t("d_recv"):t("d_need")}</span></div>
    ${done?`<div class="why" style="margin-top:8px">${esc(d.file_name||"")}${d.doc_date?" · "+esc(d.doc_date):""} ${t("d_again")}</div>`:""}
    ${UPLOADS?`<div class="up">
      ${d.kind==="inspection"?`<input type="date" data-date="${d.id}" value="${esc(d.doc_date||"")}" title="${t('d_insp_date')}">`:""}
      <label class="upbtn">${done?t("d_replace"):t("d_upload")}<input type="file" data-file="${d.id}" accept="image/*,application/pdf"></label>
      <span class="why" data-out="${d.id}"></span></div>`
      :`<div class="why" style="margin-top:8px">${t("d_email")}</div>`}
  </div>`;
}

function render(){
  const d=DATA, c=d.carrier||{};
  if(!A._seeded){ Object.assign(A,d.prefill||{},d.progress||{}); A._seeded=1; }
  DOCS=d.docs||[]; SECURE=!!d.secure_enabled; UPLOADS=!!d.uploads_enabled;
  $("#wrap").innerHTML=`
  <div class="lang">
    <button data-lang="en" class="${lang==="en"?"on":""}">EN</button>
    <button data-lang="es" class="${lang==="es"?"on":""}">ES</button>
  </div>
  <div class="top">
    <div class="badge">${t("step")}</div>
    <h1>${t("h1")}</h1>
    <div class="sub">${esc(c.name||"")}${c.terminal?" · "+esc(c.terminal):""}</div>
    <p class="sub" style="margin:12px 0 0">${t("intro")}</p>
  </div>

  <div class="err" id="err"></div>

  ${d.carrier_app?`<div class="sec" style="${d.carrier_app.started?"":"border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.09)"}">
    <h2>${d.carrier_app.started?t("ca_done"):t("ca_h")}</h2>
    <p class="note">${d.carrier_app.started?t("ca_started"):t("ca_new")}</p>
    <a class="btn" href="${esc(d.carrier_app.url)}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">${d.carrier_app.started?t("ca_btn2"):t("ca_btn")}</a>
  </div>`:""}

  ${d.carrier_app?`<div class="sec">
    <h2>${t("pg_h")}</h2><p class="note">${t("pg_n")}</p>
    <div class="f"><label>${t("pg_conf")}<span class="hint">${t("pg_conf_h")}</span></label>
      <input id="f_confirmation_no" value="${esc(A.confirmation_no||"")}"></div>
    ${ynField("clearinghouse_ok",t("pg_cl"),t("pg_cl_h"))}
    <div class="f"><label>${t("pg_dt")}<span class="hint">${t("pg_dt_h")}</span></label>
      <input id="f_drug_test_scheduled_at" type="date" value="${esc(A.drug_test_scheduled_at||"")}">
      ${A.drug_test_due?`<div class="hint" style="color:#b7791f;font-weight:600;margin-top:6px">${t("pg_due",{d:esc(A.drug_test_due)})}</div>`:""}</div>
    <div class="f"><label class="chip${A.drug_test_done_at?" sel":""}" id="dtDone" style="display:inline-flex">${t("pg_done")}</label></div>
  </div>`:""}

  <div class="sec">
    <h2>${t("s1")}</h2><p class="note">${t("s1n")}</p>
    <div class="f"><label>${t("name")}</label><input id="f_name" value="${esc(A.name||"")}" disabled style="background:#f7f8fa"></div>
    <div class="grid2">
      <div class="f"><label>${t("cell")}</label><input id="f_phone" type="tel" value="${esc(A.phone||"")}"></div>
      <div class="f"><label>${t("home")} <span class="hint">${t("home_h")}</span></label><input id="f_home_phone" type="tel" value="${esc(A.home_phone||"")}"></div>
    </div>
    <div class="f"><label>${t("addr")}</label><input id="f_address" value="${esc(A.address||"")}"></div>
    <div class="grid3">
      <div class="f"><label>${t("city")}</label><input id="f_city" value="${esc(A.city||"")}"></div>
      <div class="f"><label>${t("state")}</label><select id="f_state">${stateOpts(A.state)}</select></div>
      <div class="f"><label>${t("zip")}</label><input id="f_postcode" value="${esc(A.postcode||"")}" inputmode="numeric"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>${t("gender")} <span class="hint">${t("gender_h")}</span></label>
        <select id="f_gender"><option value="">${t("dash")}</option><option${A.gender==="M"?" selected":""}>M</option><option${A.gender==="F"?" selected":""}>F</option></select></div>
      <div class="f"><label>${t("cit")}</label>
        <select id="f_us_citizen"><option value="">${t("dash")}</option><option value="1"${A.us_citizen===1?" selected":""}>${t("yes")}</option><option value="0"${A.us_citizen===0?" selected":""}>${t("no")}</option></select></div>
    </div>
    ${SECURE?`<div class="secure">
      <div class="lock">${t("lock")}</div>
      <p class="note" style="margin:0 0 12px">${t("lock_n")}</p>
      <div class="grid2">
        <div class="f"><label>${t("ssn")}</label><input id="f_ssn" inputmode="numeric" autocomplete="off" placeholder="•••-••-••••"></div>
        <div class="f"><label>${t("dl")}</label><input id="f_dl_number" autocomplete="off"></div>
      </div></div>`:""}
  </div>

  <div class="sec">
    <h2>${t("s2")}</h2><p class="note">${t("s2n")}</p>
    <div class="grid3">
      <div class="f"><label>${t("yr")}</label><input id="f_truck_year" type="number" inputmode="numeric" value="${esc(A.truck_year||"")}"></div>
      <div class="f"><label>${t("mk")}</label><input id="f_truck_make" value="${esc(A.truck_make||"")}"></div>
      <div class="f"><label>${t("col")}</label><input id="f_truck_color" value="${esc(A.truck_color||"")}"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>${t("plate")}</label><input id="f_truck_plate" value="${esc(A.truck_plate||"")}"></div>
      <div class="f"><label>${t("plate_st")}</label><select id="f_truck_plate_state">${stateOpts(A.truck_plate_state)}</select></div>
    </div>
    <div class="grid2">
      <div class="f"><label>${t("vin")}</label><input id="f_truck_vin" value="${esc(A.truck_vin||"")}"></div>
      <div class="f"><label>${t("unit")} <span class="hint">${t("unit_h")}</span></label><input id="f_truck_unit_no" value="${esc(A.truck_unit_no||"")}"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>${t("lien")} <span class="hint">${t("lien_h")}</span></label><input id="f_lienholder" value="${esc(A.lienholder||"")}"></div>
      <div class="f"><label>${t("val")}</label><input id="f_truck_value" type="number" inputmode="numeric" value="${esc(A.truck_value||"")}"></div>
    </div>
    <div class="f"><label>${t("lien_a")}</label><input id="f_lienholder_address" value="${esc(A.lienholder_address||"")}"></div>
    <div class="grid2">
      <div class="f"><label>${t("lien_p")}</label><input id="f_lienholder_phone" value="${esc(A.lienholder_phone||"")}"></div>
      <div class="f"><label>${t("lien_e")}</label><input id="f_lienholder_email" value="${esc(A.lienholder_email||"")}"></div>
    </div>
  </div>

  <div class="sec">
    <h2>${t("s3")}</h2><p class="note">${t("s3n")}</p>
    ${ynField("wants_carrier_plates",t("plates"),t("plates_h"))}
    <div id="plateNote" class="note" style="display:none;background:var(--brand-wash);border-radius:10px;padding:11px 13px;margin:-6px 0 15px;color:#1d4ea8">
      ${t("plates_note")}
    </div>
    ${ynField("wants_ifta",t("ifta"),t("ifta_h"))}
    ${ynField("wants_maintenance",t("maint"),t("maint_h"))}
    <div class="grid2" id="maintFields" style="display:none">
      <div class="f"><label>${t("maint_w")}</label><input id="f_maintenance_weekly" type="number" inputmode="decimal" value="${esc(A.maintenance_weekly||"")}"></div>
      <div class="f"><label>${t("maint_m")}</label><input id="f_maintenance_max" type="number" inputmode="decimal" value="${esc(A.maintenance_max||"")}"></div>
    </div>
  </div>

  ${SECURE?`<div class="sec">
    <h2>${t("s4")}</h2><p class="note">${t("s4n")}</p>
    <div class="secure">
      <div class="lock">${t("lock")}</div>
      <div class="grid2">
        <div class="f"><label>${t("bank")}</label><input id="f_bank_name" autocomplete="off"></div>
        <div class="f"><label>${t("acct_n")}</label><input id="f_account_name" autocomplete="off" value="${esc(A.name||"")}"></div>
      </div>
      <div class="grid2">
        <div class="f"><label>${t("routing")}</label><input id="f_routing" inputmode="numeric" autocomplete="off"></div>
        <div class="f"><label>${t("account")}</label><input id="f_account" inputmode="numeric" autocomplete="off"></div>
      </div>
      <p class="note" style="margin:0">${t("s4_foot")}</p>
    </div>
  </div>`:""}

  <div class="sec">
    <h2>${t("s5")}</h2><p class="note">${t("s5n")}</p>
    ${ynField("has_business",t("biz"),"")}
    <div id="bizFields" style="display:none">
      <div class="grid2">
        <div class="f"><label>${t("bizname")}</label><input id="f_business_name" value="${esc(A.business_name||"")}"></div>
        <div class="f"><label>${t("ein")}</label><input id="f_business_ein" value="${esc(A.business_ein||"")}"></div>
      </div>
      <div class="f"><label>${t("bizowner")}</label><input id="f_business_owner" value="${esc(A.business_owner||"")}"></div>
      <div class="f"><label>${t("bizaddr")}</label><input id="f_business_address" value="${esc(A.business_address||"")}"></div>
      <div class="grid2">
        <div class="f"><label>${t("bizphone")}</label><input id="f_business_phone" value="${esc(A.business_phone||"")}"></div>
        <div class="f"><label>${t("bizemail")}</label><input id="f_business_email" value="${esc(A.business_email||"")}"></div>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>${t("s6")}</h2><p class="note">${t("s6n")}</p>
    <div id="docList">${DOCS.map(docCard).join("")}</div>
  </div>`;

  ["phone","home_phone","address","city","state","postcode","gender","us_citizen","truck_year","truck_make",
   "truck_color","truck_plate","truck_plate_state","truck_vin","truck_unit_no","lienholder","truck_value",
   "lienholder_address","lienholder_phone","lienholder_email","maintenance_weekly","maintenance_max",
   "business_name","business_ein","business_owner","business_address","business_phone","business_email",
   "ssn","dl_number","bank_name","account_name","routing","account",
   "confirmation_no","drug_test_scheduled_at"].forEach(k=>{
    const el=$("#f_"+k); if(!el)return;
    const set=()=>{A[k]=el.value;};
    el.oninput=set; el.onchange=set;
  });
  wireYN($("#wrap"));
  const dt=$("#dtDone");
  if(dt) dt.onclick=()=>{ const on=dt.classList.toggle("sel");
    A.drug_test_done_at = on ? new Date().toISOString().slice(0,10) : ""; };
  wireDocs();
  document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
    lang=b.dataset.lang;
    try{ localStorage.setItem("tt_lang",lang); }catch(e){}
    render();                    // answers live in A, so nothing is lost
  });
  reflect();
  $("#saveBtn").textContent=DATA.done?t("save2"):t("save");
  $("#bar").style.display="flex";
  document.documentElement.lang=lang;
}

function wireDocs(){
  document.querySelectorAll("[data-file]").forEach(inp=>inp.onchange=async()=>{
    const id=inp.dataset.file, out=$(`[data-out="${id}"]`), f=inp.files&&inp.files[0];
    if(!f)return;
    const dateEl=$(`[data-date="${id}"]`);
    if(dateEl && !dateEl.value){ out.textContent=t("d_date_first"); return; }
    out.textContent=t("d_uploading");
    const fd=new FormData(); fd.append("file",f);
    let q=`/api/apply/upload?token=${encodeURIComponent(TOKEN)}&doc=${encodeURIComponent(id)}`;
    if(dateEl&&dateEl.value) q+=`&date=${encodeURIComponent(dateEl.value)}`;
    try{
      const r=await fetch(q,{method:"POST",body:fd});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||"Upload failed.");
      const doc=DOCS.find(x=>x.id===id);
      if(doc){ doc.status="received"; doc.file_name=d.file; if(dateEl&&dateEl.value)doc.doc_date=dateEl.value; }
      $("#docList").innerHTML=DOCS.map(docCard).join(""); wireDocs(); reflect();
    }catch(e){ out.textContent=e.message; }
  });
}

function done(msg){
  $("#wrap").innerHTML=`<div class="top msg"><div class="check">✓</div>
    <h1 style="margin:0 0 8px;font-size:22px">${t("done_h")}</h1>
    <p style="color:var(--soft);margin:0 0 8px">${msg||t("done_p")}</p>
    <p style="color:var(--soft);margin:0;font-size:14px">${t("done_foot")}</p></div>`;
  $("#bar").style.display="none"; window.scrollTo(0,0);
}

async function save(){
  const btn=$("#saveBtn"), err=$("#err");
  btn.disabled=true; btn.textContent=t("saving");
  try{
    const r=await fetch("/api/apply/lease?token="+encodeURIComponent(TOKEN),
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(A)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||"Something went wrong.");
    const left=DOCS.filter(x=>x.status!=="received"&&x.kind!=="lease_form").length;
    done(left?t("done_left",{n:left,s:left===1?"":"s",it:left===1?(lang==="es"?"lo":" it"):(lang==="es"?"los":" them")}):null);
  }catch(e){
    err.textContent=e.message; err.style.display="block"; window.scrollTo(0,0);
    btn.disabled=false; btn.textContent=t("save");
  }
}

(async function(){
  try{
    const r=await fetch("/api/apply/lease?token="+encodeURIComponent(TOKEN));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"This link isn't working.");
    DATA=d;
    render();
    $("#saveBtn").onclick=save;
  }catch(e){
    $("#wrap").innerHTML=`<div class="top msg"><h1 style="font-size:20px;margin:0 0 8px">${t("err_open")}</h1><p style="color:var(--soft);margin:0">${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
