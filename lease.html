<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lease Info &amp; Documents</title>
<style>
  :root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2733;--soft:#5b6472;--line:#e3e8ef;--brand:#2f6fed;--brand-wash:#eef3fe;--ok:#1f9d6b;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 130px}
  .top,.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .top h1{margin:0 0 6px;font-size:23px;line-height:1.25}
  .top .sub{color:var(--soft);font-size:14px}
  .badge{display:inline-block;background:var(--brand-wash);color:var(--brand);font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;margin-bottom:11px;letter-spacing:.04em;text-transform:uppercase}
  .sec h2{margin:0 0 4px;font-size:17px}
  .sec .note{color:var(--soft);font-size:13.5px;margin:0 0 16px}
  .f{margin-bottom:15px}
  .f>label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .f .hint{font-weight:400;color:var(--soft);font-size:12.5px;display:block;margin-top:2px}
  .f input,.f select,.f textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff;color:var(--ink)}
  .f input:focus,.f select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .yn{display:flex;gap:9px}
  .yn button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;color:var(--soft)}
  .yn button.sel{border-color:var(--brand);background:var(--brand-wash);color:var(--brand)}
  .yn button.sel.no{border-color:#d99;background:#fdecec;color:#9b2c2c}
  .secure{background:#f7fbf8;border:1px solid #cfe8db;border-radius:12px;padding:14px;margin-bottom:15px}
  .secure .lock{font-size:12.5px;color:#137a52;font-weight:700;margin-bottom:9px;display:flex;gap:6px;align-items:center}
  .doc{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .doc.done{border-color:#b7e4cd;background:#f6fcf9}
  .doc .dt{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc .nm{font-weight:600;font-size:14.5px}
  .doc .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:#f1eef4;color:#7c7288;white-space:nowrap}
  .doc.done .st{background:#e4f6ee;color:#137a52}
  .doc .why{color:var(--soft);font-size:12.5px;margin-top:3px}
  .up{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .up input[type=file]{display:none}
  .upbtn{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:9px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .up input[type=date]{padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:center;box-shadow:0 -2px 12px rgba(20,22,40,.06)}
  .bar .inner{max-width:720px;width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px 26px;font:inherit;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.55}
  .prog{font-size:13px;color:var(--soft)}
  .msg{text-align:center;padding:52px 22px}
  .check{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
  .err{background:#fdecec;border:1px solid #f5c2c2;color:#9b2c2c;border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:none}
  @media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="top"><div class="sub">Loading…</div></div></div>
<div class="bar" id="bar" style="display:none"><div class="inner">
  <span class="prog" id="prog"></span>
  <button class="btn" id="saveBtn">Send my information</button>
</div></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const TOKEN=new URLSearchParams(location.search).get("token")||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATES=["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
const A={};
let DOCS=[], SECURE=false, UPLOADS=false;

function stateOpts(sel){ return `<option value="">—</option>`+STATES.map(s=>`<option${s===sel?" selected":""}>${s}</option>`).join(""); }
function ynField(key,label,hint){
  return `<div class="f"><label>${label}${hint?`<span class="hint">${hint}</span>`:""}</label>
    <div class="yn" data-yn="${key}"><button type="button" data-v="1">Yes</button><button type="button" data-v="0">No</button></div></div>`;
}
function wireYN(root){
  root.querySelectorAll("[data-yn]").forEach(g=>{
    const key=g.dataset.yn;
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      A[key]=b.dataset.v==="1"?1:0;
      g.querySelectorAll("button").forEach(x=>x.classList.remove("sel","no"));
      b.classList.add("sel"); if(b.dataset.v==="0")b.classList.add("no");
      reflect();
    });
    if(A[key]!=null){ const b=g.querySelector(`[data-v="${A[key]}"]`); if(b){b.classList.add("sel"); if(A[key]===0)b.classList.add("no");} }
  });
}
// The plate program is what makes the title and the 2290 necessary — say so
// where the driver is actually making the choice.
function reflect(){
  const m=$("#plateNote");
  if(m) m.style.display=A.wants_carrier_plates===1?"block":"none";
  const mt=$("#maintFields");
  if(mt) mt.style.display=A.wants_maintenance===1?"grid":"none";
  const bz=$("#bizFields");
  if(bz) bz.style.display=A.has_business===1?"block":"none";
  const done=DOCS.filter(d=>d.status==="received").length;
  const p=$("#prog");
  if(p) p.textContent=DOCS.length?`${done} of ${DOCS.length} documents in`:"";
}

function docCard(d){
  const why={
    registration:"Your truck's current registration.",
    title:"Front and back — needed for the carrier's plate program.",
    form_2290:"Your current Heavy Highway Use Tax form.",
    ecm_photo:"Just a photo of the port where the ELD plugs in.",
    inspection:"Must be dated within the last 30 days. Add the date below.",
    voided_check:"So your settlements go to the right account.",
    form_1099:"Your last 3 years of 1099s. The carrier asks for these when previous employers can't be reached to verify your experience.",
    lease_form:"Handled by this page — nothing to upload.",
  }[d.kind]||"";
  const done=d.status==="received";
  if(d.kind==="lease_form") return "";
  return `<div class="doc${done?" done":""}" data-doc="${d.id}">
    <div class="dt"><div><div class="nm">${esc(d.label||d.kind)}</div>${why?`<div class="why">${esc(why)}</div>`:""}</div>
      <span class="st">${done?"✓ received":"needed"}</span></div>
    ${done?`<div class="why" style="margin-top:8px">${esc(d.file_name||"")}${d.doc_date?" · "+esc(d.doc_date):""} — send a new one any time to replace it.</div>`:""}
    ${UPLOADS?`<div class="up">
      ${d.kind==="inspection"?`<input type="date" data-date="${d.id}" value="${esc(d.doc_date||"")}" title="Inspection date">`:""}
      <label class="upbtn">${done?"Replace":"Take a photo or upload"}<input type="file" data-file="${d.id}" accept="image/*,application/pdf"></label>
      <span class="why" data-out="${d.id}"></span></div>`
      :`<div class="why" style="margin-top:8px">Email this one to us and we'll add it.</div>`}
  </div>`;
}

function render(d){
  const c=d.carrier||{};
  Object.assign(A,d.prefill||{});
  DOCS=d.docs||[]; SECURE=!!d.secure_enabled; UPLOADS=!!d.uploads_enabled;
  $("#wrap").innerHTML=`
  <div class="top">
    <div class="badge">Step 2 of 2</div>
    <h1>Let's get your lease ready</h1>
    <div class="sub">${esc(c.name||"")}${c.terminal?" · "+esc(c.terminal):""}</div>
    <p class="sub" style="margin:12px 0 0">Two things here: the details the lease agreement needs, and a few documents. You can upload photos straight from your phone, and this link stays live — do what you can now and come back for the rest.</p>
  </div>

  <div class="err" id="err"></div>

  ${d.carrier_app?`<div class="sec" style="${d.carrier_app.started?"":"border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.09)"}">
    <h2>${d.carrier_app.started?"✓ ":""}The carrier's own application</h2>
    <p class="note">${d.carrier_app.started
      ? "You've opened this already. If you didn't finish it, pick up where you left off — nothing below replaces it."
      : "Separate from this page, and it has to be done: it goes straight to their Safety team and gets you a confirmation number. Around 20 minutes — have your employment history to hand."}</p>
    <a class="btn" href="${esc(d.carrier_app.url)}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">${d.carrier_app.started?"Reopen the carrier application ↗":"Open the carrier application ↗"}</a>
  </div>`:""}

  <div class="sec">
    <h2>Your details</h2>
    <p class="note">Exactly as they should appear on the lease.</p>
    <div class="f"><label>Full name</label><input id="f_name" value="${esc(A.name||"")}" disabled style="background:#f7f8fa"></div>
    <div class="grid2">
      <div class="f"><label>Cell phone</label><input id="f_phone" type="tel" value="${esc(A.phone||"")}"></div>
      <div class="f"><label>Home phone <span class="hint">Optional.</span></label><input id="f_home_phone" type="tel" value="${esc(A.home_phone||"")}"></div>
    </div>
    <div class="f"><label>Street address</label><input id="f_address" value="${esc(A.address||"")}"></div>
    <div class="grid3">
      <div class="f"><label>City</label><input id="f_city" value="${esc(A.city||"")}"></div>
      <div class="f"><label>State</label><select id="f_state">${stateOpts(A.state)}</select></div>
      <div class="f"><label>Zip</label><input id="f_postcode" value="${esc(A.postcode||"")}" inputmode="numeric"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>Gender <span class="hint">The lease form asks.</span></label>
        <select id="f_gender"><option value="">—</option><option${A.gender==="M"?" selected":""}>M</option><option${A.gender==="F"?" selected":""}>F</option></select></div>
      <div class="f"><label>U.S. citizen</label>
        <select id="f_us_citizen"><option value="">—</option><option value="1"${A.us_citizen===1?" selected":""}>Yes</option><option value="0"${A.us_citizen===0?" selected":""}>No</option></select></div>
    </div>
    ${SECURE?`<div class="secure">
      <div class="lock">🔒 Encrypted — used once, then deleted</div>
      <p class="note" style="margin:0 0 12px">The carrier's lease and payroll setup needs these. They're encrypted the moment you send them, nobody browses them in our system, and they're destroyed once your lease is signed.</p>
      <div class="grid2">
        <div class="f"><label>Social Security number</label><input id="f_ssn" inputmode="numeric" autocomplete="off" placeholder="•••-••-••••"></div>
        <div class="f"><label>Driver's licence number</label><input id="f_dl_number" autocomplete="off"></div>
      </div></div>`:""}
  </div>

  <div class="sec">
    <h2>Your truck</h2>
    <p class="note">The lease is written against this equipment.</p>
    <div class="grid3">
      <div class="f"><label>Year</label><input id="f_truck_year" type="number" inputmode="numeric" value="${esc(A.truck_year||"")}"></div>
      <div class="f"><label>Make</label><input id="f_truck_make" value="${esc(A.truck_make||"")}"></div>
      <div class="f"><label>Color</label><input id="f_truck_color" value="${esc(A.truck_color||"")}"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>Plate #</label><input id="f_truck_plate" value="${esc(A.truck_plate||"")}"></div>
      <div class="f"><label>Plate state</label><select id="f_truck_plate_state">${stateOpts(A.truck_plate_state)}</select></div>
    </div>
    <div class="grid2">
      <div class="f"><label>VIN</label><input id="f_truck_vin" value="${esc(A.truck_vin||"")}"></div>
      <div class="f"><label>Unit # <span class="hint">Optional.</span></label><input id="f_truck_unit_no" value="${esc(A.truck_unit_no||"")}"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>Lienholder <span class="hint">Blank if paid off.</span></label><input id="f_lienholder" value="${esc(A.lienholder||"")}"></div>
      <div class="f"><label>Truck value</label><input id="f_truck_value" type="number" inputmode="numeric" value="${esc(A.truck_value||"")}"></div>
    </div>
    <div class="f"><label>Lienholder address</label><input id="f_lienholder_address" value="${esc(A.lienholder_address||"")}"></div>
    <div class="grid2">
      <div class="f"><label>Lienholder phone</label><input id="f_lienholder_phone" value="${esc(A.lienholder_phone||"")}"></div>
      <div class="f"><label>Lienholder email</label><input id="f_lienholder_email" value="${esc(A.lienholder_email||"")}"></div>
    </div>
  </div>

  <div class="sec">
    <h2>What you want the carrier to cover</h2>
    <p class="note">These are weekly deductions from your settlement — your call on each.</p>
    ${ynField("wants_carrier_plates","Carrier-provided plates?","$50 a week.")}
    <div id="plateNote" class="note" style="display:none;background:var(--brand-wash);border-radius:10px;padding:11px 13px;margin:-6px 0 15px;color:#1d4ea8">
      Because you've chosen the plate program, we'll need your <b>title (front and back)</b> and your <b>current 2290</b> — both are in the document list below.
    </div>
    ${ynField("wants_ifta","Carrier-provided IFTA?","$10 a week.")}
    ${ynField("wants_maintenance","Set up a maintenance escrow?","Money set aside weekly for repairs.")}
    <div class="grid2" id="maintFields" style="display:none">
      <div class="f"><label>Amount per week</label><input id="f_maintenance_weekly" type="number" inputmode="decimal" value="${esc(A.maintenance_weekly||"")}"></div>
      <div class="f"><label>Maximum to hold</label><input id="f_maintenance_max" type="number" inputmode="decimal" value="${esc(A.maintenance_max||"")}"></div>
    </div>
  </div>

  ${SECURE?`<div class="sec">
    <h2>Direct deposit</h2>
    <p class="note">So you get paid without waiting on a paper check.</p>
    <div class="secure">
      <div class="lock">🔒 Encrypted — used once, then deleted</div>
      <div class="grid2">
        <div class="f"><label>Bank name</label><input id="f_bank_name" autocomplete="off"></div>
        <div class="f"><label>Name on the account</label><input id="f_account_name" autocomplete="off" value="${esc(A.name||"")}"></div>
      </div>
      <div class="grid2">
        <div class="f"><label>Routing number</label><input id="f_routing" inputmode="numeric" autocomplete="off"></div>
        <div class="f"><label>Account number</label><input id="f_account" inputmode="numeric" autocomplete="off"></div>
      </div>
      <p class="note" style="margin:0">You'll also upload a voided check below — the carrier asks for both.</p>
    </div>
  </div>`:""}

  <div class="sec">
    <h2>Business setup</h2>
    <p class="note">Only if the truck is owned by your company, or you want to be paid as a business.</p>
    ${ynField("has_business","Leasing under an LLC or company?","")}
    <div id="bizFields" style="display:none">
      <div class="grid2">
        <div class="f"><label>Business name</label><input id="f_business_name" value="${esc(A.business_name||"")}"></div>
        <div class="f"><label>Federal ID # (EIN)</label><input id="f_business_ein" value="${esc(A.business_ein||"")}"></div>
      </div>
      <div class="f"><label>Business owner</label><input id="f_business_owner" value="${esc(A.business_owner||"")}"></div>
      <div class="f"><label>Business address</label><input id="f_business_address" value="${esc(A.business_address||"")}"></div>
      <div class="grid2">
        <div class="f"><label>Business phone</label><input id="f_business_phone" value="${esc(A.business_phone||"")}"></div>
        <div class="f"><label>Business email</label><input id="f_business_email" value="${esc(A.business_email||"")}"></div>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>Documents</h2>
    <p class="note">Photos from your phone are fine, as long as everything's readable.</p>
    <div id="docList">${DOCS.map(docCard).join("")}</div>
  </div>`;

  ["phone","home_phone","address","city","state","postcode","gender","us_citizen","truck_year","truck_make",
   "truck_color","truck_plate","truck_plate_state","truck_vin","truck_unit_no","lienholder","truck_value",
   "lienholder_address","lienholder_phone","lienholder_email","maintenance_weekly","maintenance_max",
   "business_name","business_ein","business_owner","business_address","business_phone","business_email",
   "ssn","dl_number","bank_name","account_name","routing","account"].forEach(k=>{
    const el=$("#f_"+k); if(!el)return;
    const set=()=>{A[k]=el.value;};
    el.oninput=set; el.onchange=set;
  });
  wireYN($("#wrap"));
  wireDocs();
  reflect();
  $("#bar").style.display="flex";
}

function wireDocs(){
  document.querySelectorAll("[data-file]").forEach(inp=>inp.onchange=async()=>{
    const id=inp.dataset.file, out=$(`[data-out="${id}"]`), f=inp.files&&inp.files[0];
    if(!f)return;
    const dateEl=$(`[data-date="${id}"]`);
    if(dateEl && !dateEl.value){ out.textContent="Add the inspection date first."; return; }
    out.textContent="Uploading…";
    const fd=new FormData(); fd.append("file",f);
    let q=`/api/apply/upload?token=${encodeURIComponent(TOKEN)}&doc=${encodeURIComponent(id)}`;
    if(dateEl&&dateEl.value) q+=`&date=${encodeURIComponent(dateEl.value)}`;
    try{
      const r=await fetch(q,{method:"POST",body:fd});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||"Upload failed.");
      const doc=DOCS.find(x=>x.id===id);
      if(doc){ doc.status="received"; doc.file_name=d.file; if(dateEl&&dateEl.value)doc.doc_date=dateEl.value; }
      $("#docList").innerHTML=DOCS.map(docCard).join(""); wireDocs(); reflect();
    }catch(e){ out.textContent=e.message; }
  });
}

function done(msg){
  $("#wrap").innerHTML=`<div class="top msg"><div class="check">✓</div>
    <h1 style="margin:0 0 8px;font-size:22px">Got it — thank you</h1>
    <p style="color:var(--soft);margin:0 0 8px">${msg||"Your information is in and we're preparing your lease agreement."}</p>
    <p style="color:var(--soft);margin:0;font-size:14px">We'll be in touch about your orientation date. If we need anything else, we'll email you.</p></div>`;
  $("#bar").style.display="none"; window.scrollTo(0,0);
}

async function save(){
  const btn=$("#saveBtn"), err=$("#err");
  btn.disabled=true; btn.textContent="Sending…";
  try{
    const r=await fetch("/api/apply/lease?token="+encodeURIComponent(TOKEN),
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(A)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||"Something went wrong.");
    const left=DOCS.filter(x=>x.status!=="received"&&x.kind!=="lease_form").length;
    done(left?`Your information is in. We still need ${left} document${left===1?"":"s"} — come back to this same link any time to add ${left===1?"it":"them"}.`:null);
  }catch(e){
    err.textContent=e.message; err.style.display="block"; window.scrollTo(0,0);
    btn.disabled=false; btn.textContent="Send my information";
  }
}

(async function(){
  try{
    const r=await fetch("/api/apply/lease?token="+encodeURIComponent(TOKEN));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"This link isn't working.");
    render(d);
    if(d.done){
      // Already submitted: they're here to finish uploading documents.
      $("#saveBtn").textContent="Update my information";
    }
    $("#saveBtn").onclick=save;
  }catch(e){
    $("#wrap").innerHTML=`<div class="top msg"><h1 style="font-size:20px;margin:0 0 8px">We couldn't open this page</h1><p style="color:var(--soft);margin:0">${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
