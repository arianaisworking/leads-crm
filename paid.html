<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deposit received</title>
<style>
  body{margin:0;background:#eef1f6;color:#1a2230;font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid #e6ebf2;border-radius:18px;box-shadow:0 6px 24px rgba(20,30,50,.08);max-width:460px;width:100%;padding:34px 30px;text-align:center}
  .brand{font-size:12px;font-weight:700;color:#2f6fed;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px}
  .check{width:60px;height:60px;border-radius:50%;background:#12704c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#5b6472;margin:0 0 6px}
  .cancel .check{background:#b3452f}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">MXN Cells</div>
  <div class="check">✓</div>
  <h1>Thank you — deposit received</h1>
  <p>Your consultation deposit has been paid. Our team will be in touch to finalize your travel, lodging and aftercare.</p>
  <p>You can close this window.</p>
</div>
<script>
  var q=new URLSearchParams(location.search);
  if(q.get("status")==="cancel"){
    var c=document.getElementById("card"); c.className="card cancel";
    c.innerHTML='<div class="brand">MXN Cells</div><div class="check">!</div><h1>Payment canceled</h1><p>No charge was made. If you\'d like to complete your deposit, reopen the payment link we sent you, or reply to our email and we\'ll help.</p>';
  } else {
    // Confirm the payment server-side so the deposit is marked paid.
    var token=q.get("token"), sid=q.get("session_id");
    if(token && sid){
      fetch("/api/intake/paid-check?token="+encodeURIComponent(token),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({session_id:sid})}).catch(function(){});
    }
  }
</script>
</body>
</html>
