<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply to drive — Truckers &amp; Trokeros</title>
<meta name="description" content="Tell us what you're looking for. We check you against the carrier's real standards and come back the same day — in English or Spanish.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://truckersandtrokeros.com/drivers">
<link rel="alternate" hreflang="en" href="https://truckersandtrokeros.com/drivers">
<link rel="alternate" hreflang="es" href="https://truckersandtrokeros.com/es/drivers">
<link rel="alternate" hreflang="x-default" href="https://truckersandtrokeros.com/drivers">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:type" content="website">
<meta property="og:url" content="https://truckersandtrokeros.com/drivers">
<meta property="og:title" content="Apply to drive — Truckers &amp; Trokeros">
<meta property="og:description" content="Own your truck? Five minutes, and you'll know where you stand.">
<meta property="og:image" content="https://truckersandtrokeros.com/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
  /* The application page. One job: get the short form filled in. Everything
     else on the page exists to answer the doubt that stops someone finishing
     it — what it costs, who sees it, and whether a person is on the other end. */
  .apphead{position:relative;background:var(--ink);color:#fff;overflow:hidden;isolation:isolate;
    padding:46px 0 150px}
  .apphead .shot{position:absolute;inset:0;z-index:0}
  .apphead .shot img{width:100%;height:100%;object-fit:cover;object-position:center 62%}
  .apphead .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(11,11,12,.6) 0%,rgba(11,11,12,.78) 52%,var(--ink) 100%)}
  .apphead .wrap{position:relative;z-index:2;text-align:center}
  .apphead .eyebrow{justify-content:center}
  .apphead h1{font-size:clamp(32px,7.4vw,58px);margin-bottom:14px}
  .apphead p{color:#c4c6ca;font-size:17.5px;margin:0 auto;max-width:52ch}

  /* the four stages, so nobody thinks this one form is the whole process */
  .stages{display:flex;justify-content:center;gap:0;flex-wrap:wrap;margin-top:30px}
  .stage{display:flex;align-items:center;gap:9px;padding:0 6px}
  .stage .n{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-family:"Anton",Impact,sans-serif;font-size:14px;
    border:1.5px solid rgba(255,255,255,.3);color:#9a9ca1}
  .stage.now .n{background:var(--red);border-color:var(--red);color:#fff}
  .stage span{font-size:13.5px;font-weight:600;color:#9a9ca1;white-space:nowrap}
  .stage.now span{color:#fff}
  .stages .bar{width:26px;height:1.5px;background:rgba(255,255,255,.2);margin:0 4px;flex:none}
  /* Four across doesn't fit a phone, and letting it wrap 3+1 orphans the last
     stage. Two rows of two, with the connectors dropped — the numbers already
     say what order they come in. */
  @media(max-width:620px){
    .stages{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;max-width:320px;
      margin:26px auto 0;text-align:left}
    .stages .bar{display:none}
    .stage{padding:0}
    .stage span{font-size:13px}
  }

  /* the card lifts out of the dark band */
  .cardwrap{margin-top:-120px;position:relative;z-index:5;padding-bottom:52px}
  form.app{background:#fff;border-radius:6px;padding:28px 26px 26px;max-width:660px;margin:0 auto;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}
  form.app .top{text-align:center;margin-bottom:22px}
  form.app h2{font-size:clamp(22px,4.6vw,28px);margin-bottom:5px}
  form.app .sub{color:var(--soft);font-size:15px;margin:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.two{grid-template-columns:1fr}}
  .f{margin-bottom:14px}
  .f label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
  .f input,.f select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:4px;
    font:inherit;font-size:16px;min-height:50px;background:#fff;color:var(--text)}
  .f input:focus,.f select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(208,0,0,.13)}
  .row2{display:grid;grid-template-columns:1fr 104px;gap:11px}
  form.app .btn{width:100%;margin-top:6px}
  .fine{color:var(--soft);font-size:12.5px;margin:13px 0 0;text-align:center}
  .hp{position:absolute;left:-9999px}
  .err{background:#fdeaea;border:1px solid #f2bcbc;color:#8e1616;border-radius:4px;padding:10px 12px;
    font-size:14px;margin-bottom:12px;display:none}
  .done{text-align:center;padding:26px 6px}
  .done .big{width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
  .done h2{margin-bottom:9px}
  .done p{color:var(--text-2);font-size:15.5px;margin:0 0 8px}

  /* reassurance under the card */
  .assure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:900px;
    margin:34px auto 0;text-align:center}
  @media(max-width:760px){.assure{grid-template-columns:1fr;gap:16px;text-align:left}}
  .as{display:flex;flex-direction:column;align-items:center;gap:9px}
  @media(max-width:760px){.as{flex-direction:row;align-items:flex-start;gap:13px}}
  .as .ic{width:56px;height:56px;flex:none}
  .as .ic img{width:100%;height:100%;object-fit:contain}
  .as h3{font-size:17px;margin-bottom:4px}
  .as p{margin:0;color:var(--text-2);font-size:14.5px;line-height:1.5}
  .helpline{text-align:center;margin-top:30px;font-size:15.5px;color:var(--text-2)}
  .helpline a{font-weight:600}

  /* ── everything below the form ───────────────────────────────────────────
     The home page used to carry all of this. It belongs here: a driver reads
     it while deciding whether to finish the form, not while deciding whether
     the company is worth a click. */
  .sec-h{font-size:clamp(27px,5.4vw,40px);text-align:center}
  .sec-p{text-align:center;color:var(--text-2);font-size:16.5px;max-width:56ch;margin:12px auto 0}
  section.dark .sec-p{color:#b3b5b9}
  section .eyebrow{display:flex;justify-content:center}

  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:38px}
  @media(max-width:800px){.steps{grid-template-columns:1fr;gap:13px}}
  .step{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px 22px 22px;
    text-align:center;position:relative}
  section.dark .step{background:#1c1d20;border-color:var(--line-d)}
  .step .n{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:28px;height:28px;
    border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;
    justify-content:center;font-family:"Anton",Impact,sans-serif;font-size:14px}
  .step .ic.art{width:74px;height:74px;margin:0 auto 12px}
  .step .ic.art img{width:100%;height:100%;object-fit:contain}
  .step h3{font-size:18px;margin-bottom:7px}
  .step p{margin:0;color:var(--text-2);font-size:15px;line-height:1.5}
  section.dark .step p{color:#a9abaf}

  .why{display:grid;grid-template-columns:400px 1fr;gap:38px;align-items:center;margin-top:36px}
  @media(max-width:880px){.why{grid-template-columns:1fr;gap:24px}}
  .portrait{margin:0;border-radius:6px;overflow:hidden;position:relative;background:var(--ink)}
  .portrait img{width:100%;height:100%;object-fit:cover;aspect-ratio:760/1188}
  @media(max-width:880px){.portrait img{aspect-ratio:16/10;object-position:center 28%}}
  .portrait:after{content:"";position:absolute;inset:auto 0 0 0;height:34%;
    background:linear-gradient(0deg,rgba(11,11,12,.55),transparent)}
  .wlist{display:flex;flex-direction:column}
  .wrow{display:flex;gap:15px;padding:17px 0;border-top:1px solid var(--line)}
  .wrow:first-child{border-top:0;padding-top:0}
  .wrow .ic{flex:none;margin-top:1px}
  .wrow h3{font-size:18px;margin-bottom:5px}
  .wrow p{margin:0;color:var(--text-2);font-size:15.5px;line-height:1.5}

  .reqs{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;max-width:820px;margin:34px auto 0}
  @media(max-width:680px){.reqs{grid-template-columns:1fr}}
  .req{display:flex;gap:11px;align-items:flex-start;font-size:16px}
  .req .tick{color:var(--red);font-weight:700;flex:none}
  .req .x{color:var(--soft);flex:none}
  .note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);
    border-radius:4px;padding:15px 18px;margin:26px auto 0;max-width:820px;
    color:var(--text-2);font-size:15.5px}
  .note b{color:var(--text)}

  .fees{max-width:820px;margin:34px auto 0;background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:24px 26px}
  .fees h3{font-size:20px;margin-bottom:5px}
  .fee_sub{color:var(--soft);font-size:15px;margin:0 0 16px}
  .fee{display:grid;grid-template-columns:1fr auto;gap:3px 16px;padding:13px 0;border-top:1px solid var(--line)}
  .fee:first-child{border-top:0}
  .fee .lbl{font-weight:600;font-size:16px}
  .fee .amt{font-family:"Anton",Impact,sans-serif;font-size:17px;letter-spacing:.02em;color:var(--red-dark)}
  .fee .d{grid-column:1/-1;color:var(--text-2);font-size:14.5px}
  .fee_note{color:var(--soft);font-size:14px;margin:16px 0 0}

  .faq{max-width:820px;margin:34px auto 0}
  .faq details{border-bottom:1px solid var(--line-d);padding:2px 0}
  .faq summary{cursor:pointer;padding:16px 0;font-weight:600;font-size:16.5px;color:#fff;
    list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary:after{content:"+";font-family:"Anton",Impact,sans-serif;font-size:21px;
    color:var(--red-soft);flex:none;line-height:1}
  .faq details[open] summary:after{content:"\2013"}
  .faq p{margin:0 0 17px;color:#a9abaf;font-size:15.5px;line-height:1.6}

  .backtop{text-align:center;margin-top:34px}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<header id="hdr"></header>

<div class="apphead">
  <div class="shot"><img src="/img/hero-truck.jpg" alt="" fetchpriority="high" width="1600" height="686"></div>
  <div class="scrim"></div>
  <div class="wrap">
    <span class="eyebrow" data-t="eyebrow">Owner-operator application</span>
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
    <div class="stages">
      <div class="stage now"><span class="n">1</span><span data-t="st1">Your details</span></div>
      <span class="bar"></span>
      <div class="stage"><span class="n">2</span><span data-t="st2">Experience</span></div>
      <span class="bar"></span>
      <div class="stage"><span class="n">3</span><span data-t="st3">Your record</span></div>
      <span class="bar"></span>
      <div class="stage"><span class="n">4</span><span data-t="st4">We screen you</span></div>
    </div>
  </div>
</div>

<div class="cardwrap">
  <div class="wrap">
    <form class="app" id="lead" novalidate>
      <div class="top">
        <div class="rule"><span class="streak"><i></i><i></i><i></i></span><h2 data-t="form_h"></h2><span class="streak r"><i></i><i></i><i></i></span></div>
        <p class="sub" data-t="form_sub"></p>
      </div>
      <div class="err" id="err"></div>
      <div class="two">
        <div class="f"><label data-t="l_name">Full name</label><input name="name" autocomplete="name" required></div>
        <div class="f"><label data-t="l_phone">Cell phone</label><input name="phone" type="tel" autocomplete="tel" required></div>
      </div>
      <div class="two">
        <div class="f"><label data-t="l_email">Email</label><input name="email" type="email" autocomplete="email"></div>
        <div class="f"><label data-t="l_city">City &amp; state</label>
          <div class="row2"><input name="city" autocomplete="address-level2"><input name="state" maxlength="2" placeholder="TX"></div>
        </div>
      </div>
      <div class="two">
        <div class="f"><label data-t="l_truck">Do you own your truck?</label>
          <select name="interest">
            <option value="owns" data-t="o_owns"></option>
            <option value="buying" data-t="o_buying"></option>
            <option value="no" data-t="o_no"></option>
          </select>
        </div>
        <div class="f"><label data-t="l_exp">Years of CDL-A experience</label>
          <select name="experience">
            <option value="" data-t="o_pick"></option>
            <option value="<1" data-t="o_e0"></option>
            <option value="1-2" data-t="o_e1"></option>
            <option value="3-5" data-t="o_e3"></option>
            <option value="5+" data-t="o_e5"></option>
          </select>
        </div>
      </div>
      <input class="hp" name="_hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" type="submit" data-t="form_btn"></button>
      <p class="fine" data-t="form_fine"></p>
    </form>

    <div class="assure">
      <div class="as">
        <span class="ic"><img src="/img/ico-route.png" alt="" loading="lazy" width="176" height="176"></span>
        <div><h3 data-t="as1_h"></h3><p data-t="as1_p"></p></div>
      </div>
      <div class="as">
        <span class="ic"><img src="/img/ico-driver.png" alt="" loading="lazy" width="176" height="176"></span>
        <div><h3 data-t="as2_h"></h3><p data-t="as2_p"></p></div>
      </div>
      <div class="as">
        <span class="ic"><img src="/img/ico-shield.png" alt="" loading="lazy" width="176" height="176"></span>
        <div><h3 data-t="as3_h"></h3><p data-t="as3_p"></p></div>
      </div>
    </div>
    <p class="helpline" data-t="helpline"></p>
  </div>
</div>

<section class="paper" id="how">
  <div class="wrap">
    <span class="eyebrow" data-t="h_eyebrow"></span>
    <div class="rule"><span class="streak"><i></i><i></i><i></i></span><h2 class="sec-h" data-t="h_h2"></h2><span class="streak r"><i></i><i></i><i></i></span></div>
    <p class="sec-p" data-t="h_lede"></p>
    <div class="steps">
      <div class="step"><span class="n">1</span><span class="ic art"><img src="/img/ico-check.png" alt="" loading="lazy" width="176" height="176"></span><h3 data-t="s1_h"></h3><p data-t="s1_p"></p></div>
      <div class="step"><span class="n">2</span><span class="ic art"><img src="/img/ico-match.png" alt="" loading="lazy" width="176" height="176"></span><h3 data-t="s2_h"></h3><p data-t="s2_p"></p></div>
      <div class="step"><span class="n">3</span><span class="ic art"><img src="/img/ico-terminal.png" alt="" loading="lazy" width="176" height="176"></span><h3 data-t="s3_h"></h3><p data-t="s3_p"></p></div>
    </div>
    <div class="steps" style="margin-top:22px">
      <div class="step"><span class="n">4</span><span class="ic art"><img src="/img/ico-route.png" alt="" loading="lazy" width="176" height="176"></span><h3 data-t="s4_h"></h3><p data-t="s4_p"></p></div>
      <div class="step"><span class="n">5</span><span class="ic art"><img src="/img/ico-shield.png" alt="" loading="lazy" width="176" height="176"></span><h3 data-t="s5_h"></h3><p data-t="s5_p"></p></div>
      <div class="step" style="display:flex;flex-direction:column;justify-content:center;gap:12px">
        <h3 data-t="ready_h"></h3>
        <a class="btn" href="#lead" data-t="top_btn"></a>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <span class="eyebrow" data-t="w_eyebrow"></span>
    <div class="rule"><span class="streak"><i></i><i></i><i></i></span><h2 class="sec-h" data-t="w_h2"></h2><span class="streak r"><i></i><i></i><i></i></span></div>
    <p class="sec-p" data-t="w_lede"></p>
    <div class="why">
      <figure class="portrait">
        <img src="/img/driver.jpg" alt="An owner-operator beside his tractor at a truck stop at dusk" loading="lazy" width="760" height="1188">
      </figure>
      <div class="wlist">
        <div class="wrow"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d00000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16V7h11v9"/><path d="M13 10h4l3.2 3.9V16"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></svg></span><div><h3 data-t="w1_h"></h3><p data-t="w1_p"></p></div></div>
        <div class="wrow"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d00000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg></span><div><h3 data-t="w2_h"></h3><p data-t="w2_p"></p></div></div>
        <div class="wrow"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d00000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8h9a3 3 0 0 1 0 6H5"/></svg></span><div><h3 data-t="w3_h"></h3><p data-t="w3_p"></p></div></div>
        <div class="wrow"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d00000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><div><h3 data-t="w4_h"></h3><p data-t="w4_p"></p></div></div>
      </div>
    </div>
  </div>
</section>

<section class="paper" id="requirements">
  <div class="wrap">
    <span class="eyebrow" data-t="r_eyebrow"></span>
    <div class="rule"><span class="streak"><i></i><i></i><i></i></span><h2 class="sec-h" data-t="r_h2"></h2><span class="streak r"><i></i><i></i><i></i></span></div>
    <p class="sec-p" data-t="r_lede"></p>
    <div class="reqs" id="reqs"></div>
    <div class="note" data-t="r_note"></div>
    <div class="fees">
      <h3 data-t="fee_h"></h3>
      <p class="fee_sub" data-t="fee_sub"></p>
      <div id="fees"></div>
      <p class="fee_note" data-t="fee_note"></p>
    </div>
  </div>
</section>

<section class="dark" id="faq">
  <div class="wrap">
    <span class="eyebrow" data-t="f_eyebrow"></span>
    <div class="rule"><span class="streak"><i></i><i></i><i></i></span><h2 class="sec-h" data-t="f_h2"></h2><span class="streak r"><i></i><i></i><i></i></span></div>
    <div class="faq" id="faq-list"></div>
    <div class="backtop"><a class="btn" href="#lead" data-t="top_btn"></a></div>
  </div>
</section>

<footer id="ftr"></footer>

<script src="/site.js"></script>
<script>
const T = {

    st1:"Your details", st2:"Experience", st3:"Your record", st4:"We screen you",

    form_h:"Start with the basics",
    form_sub:"Two minutes now. We'll email you the full application straight away.",
    l_name:"Full name", l_phone:"Cell phone", l_email:"Email", l_city:"City & state",
    l_truck:"Do you own your truck?", l_exp:"Years of CDL-A experience",
    o_owns:"Yes, I own it", o_buying:"I'm buying / financing one", o_no:"Not yet",

    as1_h:"You'll hear back today",

    helpline:"Stuck on any of it? <a href=\"mailto:recruiting@truckersandtrokeros.com\">Email us</a> and a person will help you through it.",

    h_eyebrow: "The process",
    h_h2: "From application to rolling",
    h_lede: "Five steps. Most drivers who qualify are in orientation within a couple of weeks.",
    s1_h: "You apply — about five minutes",

// Three blocks are data, not markup: the requirement ticks, the fee rows and
// the FAQ. They repaint with the language like everything else.
const painters = () => {
  const t = T[document.documentElement.lang] || T.en;
  document.getElementById('reqs').innerHTML = t.reqs.map(([ok, txt]) =>
    `<div class="req"><span class="${ok ? 'tick' : 'x'}">${ok ? '\u2713' : '\u2715'}</span><span>${txt}</span></div>`).join('');
  document.getElementById('fees').innerHTML = t.fees.map(([lbl, amt, d]) =>
    `<div class="fee"><div class="lbl">${lbl}</div><div class="amt">${amt}</div><div class="d">${d}</div></div>`).join('');
  document.getElementById('faq-list').innerHTML = t.faq.map(([q, a]) =>
    `<details><summary>${q}</summary><p>${a}</p></details>`).join('');
};
const _paint = paintPage;
paintPage = function () { _paint(); painters(); };

const params = new URLSearchParams(location.search);
const SOURCE = params.get('src') || 'drivers page';
const RECRUITER = params.get('r') || '';
const CARRIER = params.get('carrier') || 'evans_dal';

document.getElementById('lead').onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target, t = T[document.documentElement.lang] || T.en, err = document.getElementById('err');
  const b = Object.fromEntries(new FormData(form));
  if (!b.name || !b.phone) { err.textContent = t.err_req; err.style.display = 'block'; return; }
  err.style.display = 'none';
  b.source = SOURCE; if (RECRUITER) b.recruiter = RECRUITER;
  b.interest = 'Owner-operator · truck: ' + (b.interest || 'unknown')
    + ' · experience: ' + (b.experience || 'not said')
    + ' · lang: ' + document.documentElement.lang;
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch('/api/apply/lead?carrier=' + encodeURIComponent(CARRIER),
      { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
    form.innerHTML = `<div class="done"><div class="big">&#10003;</div>
      <h2>${t.done_h}</h2><p>${t.done_p1}</p><p>${t.done_p2}</p></div>`;
  } catch (ex) {
    err.textContent = ex.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = t.form_btn;
  }
};
