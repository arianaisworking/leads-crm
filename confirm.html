<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your treatment</title>
<style>
  :root{--bg:#eef1f6;--ink:#1a2230;--soft:#5b6472;--line:#e6ebf2;--brand:#2f6fed;--wash:#eef3fe;--ok:#12704c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 14px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 20px rgba(20,30,50,.06);padding:26px 24px;margin-bottom:14px}
  .brand{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);margin:0 0 8px}
  .sub{color:var(--soft);font-size:14px}
  .protocol{white-space:pre-wrap;background:#f7faff;border:1px solid #dbe7ff;border-radius:12px;padding:14px 16px;margin:2px 0 0}
  .total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0 2px}
  .total .amt{font-size:30px;font-weight:800;color:var(--brand)}
  .rowf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:460px){.rowf{grid-template-columns:1fr}}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:5px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
  textarea{min-height:56px;resize:vertical;margin-top:12px}
  .btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px;transition:filter .15s}
  .btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.6;cursor:default}
  .msg{text-align:center;padding:50px 20px;color:var(--soft)}
  .check{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
  .note{color:var(--soft);font-size:13px;margin-top:10px;text-align:center}
  .err{color:#b3452f;font-size:13px;margin-top:10px}
  .secure{text-align:center;color:var(--soft);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="msg">Loading…</div></div></div>
<script>
const TOKEN=new URLSearchParams(location.search).get("token")||"";
const CANCELED=new URLSearchParams(location.search).get("status")==="cancel";
const app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function money(n){return "$"+(Math.round((n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function msg(h){app.innerHTML=`<div class="card"><div class="msg">${h}</div></div>`;}

async function boot(){
  if(!TOKEN) return msg("<h2>Invalid link</h2><p>This link is missing its code.</p>");
  let d; try{ const r=await fetch("/api/intake/confirm-info?token="+encodeURIComponent(TOKEN)); d=await r.json(); if(!r.ok) return msg(esc(d.error||"This link is invalid.")); }
  catch(e){ return msg("Connection issue — please try again."); }
  if(!d.ready) return msg("<h2>Almost there</h2><p>Your treatment plan isn't ready yet. Your care team will be in touch.</p>");
  if(d.deposit_paid){
    return app.innerHTML=`<div class="card"><div class="brand">MXN Cells</div><div class="check">✓</div>
      <h1 style="text-align:center">You're all set${d.patient_name?", "+esc(d.patient_name.split(" ")[0]):""}</h1>
      <p class="sub" style="text-align:center">Your deposit is paid${d.travel_dates?" and your travel dates are in":""}. We'll confirm everything with your doctor and be in touch shortly.</p>
      ${d.travel_dates?`<p class="note">Requested travel: <b>${esc(d.travel_dates)}</b></p>`:""}</div>`;
  }
  render(d);
}

function render(d){
  const first=d.patient_name?esc(d.patient_name.split(" ")[0]):"";
  app.innerHTML=`
    <div class="card">
      <div class="brand">MXN Cells${d.doctor_name?" · "+esc(d.doctor_name):""}</div>
      <h1>Move forward with your treatment${first?", "+first:""}</h1>
      <p class="sub">Review your plan, choose your travel dates, and secure your spot with a deposit.</p>
    </div>
    ${d.protocol?`<div class="card"><h2>Your treatment plan</h2><div class="protocol">${esc(d.protocol)}</div></div>`:""}
    <div class="card">
      <h2>Your deposit</h2>
      <div class="total"><span class="sub">Amount due today</span><span class="amt">${money(d.deposit_total)}</span></div>
      <p class="sub" style="font-size:13px">This deposit reserves your treatment and travel coordination.</p>
    </div>
    <div class="card">
      <h2>Travel dates you're interested in</h2>
      <p class="sub" style="margin-bottom:12px">When would you like to travel to the clinic? Your doctor will confirm the final window.</p>
      <div class="rowf">
        <div><label>Preferred arrival</label><input type="date" id="tArrive"></div>
        <div><label>Preferred departure</label><input type="date" id="tDepart"></div>
      </div>
      <textarea id="tNotes" placeholder="Anything about your travel we should know? (flexibility, companions, etc.)"></textarea>
      <button class="btn" id="pay">Pay ${money(d.deposit_total)} deposit &amp; confirm dates →</button>
      <div class="secure">🔒 Secure card payment via Stripe</div>
      ${CANCELED?`<div class="err">Payment was canceled — no charge was made. You can try again above.</div>`:""}
      <div class="err" id="err"></div>
    </div>`;
  document.getElementById("pay").onclick=submit;
}

async function submit(){
  const arrive=document.getElementById("tArrive").value, depart=document.getElementById("tDepart").value, notes=document.getElementById("tNotes").value.trim();
  const err=document.getElementById("err"); err.textContent="";
  if(!arrive&&!depart&&!notes){ err.textContent="Please add at least your preferred travel dates."; return; }
  let dates="";
  if(arrive) dates+="Arrive "+arrive; if(depart) dates+=(dates?" → ":"")+"Depart "+depart; if(notes) dates+=(dates?" · ":"")+notes;
  const btn=document.getElementById("pay"); btn.disabled=true; btn.textContent="Starting secure payment…";
  try{ const r=await fetch("/api/intake/confirm-travel?token="+encodeURIComponent(TOKEN),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({travel_dates:dates})});
    const j=await r.json(); if(!r.ok||!j.url) throw new Error(j.error||"Could not start payment.");
    location.href=j.url;
  }catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent="Pay deposit & confirm dates →"; }
}
boot();
</script>
</body>
</html>
