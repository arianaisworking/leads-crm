<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About us — Truckers &amp; Trokeros</title>
<meta name="description" content="Two recruiters in Dallas–Fort Worth placing owner-operators with carriers. Bilingual, commission only, and straight with drivers about where they stand.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://truckersandtrokeros.com/about">
<link rel="alternate" hreflang="en" href="https://truckersandtrokeros.com/about">
<link rel="alternate" hreflang="es" href="https://truckersandtrokeros.com/es/about">
<link rel="alternate" hreflang="x-default" href="https://truckersandtrokeros.com/about">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:type" content="website">
<meta property="og:url" content="https://truckersandtrokeros.com/about">
<meta property="og:title" content="About Truckers &amp; Trokeros">
<meta property="og:description" content="Two recruiters in Dallas–Fort Worth. Bilingual, commission only, straight with drivers.">
<meta property="og:image" content="https://truckersandtrokeros.com/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/site.css">
<script src="/contact.js"></script>
<style>
  /* Who we are. Short — nobody reads an about page for long. The photograph
     carries the human part; the text is here to answer three questions:
     who, why us, and what we won't do. */
  .ahead .tex img{object-position:center 40%}
  .ahead h1{max-width:16ch}

  /* the split: portrait beside the story, stacked on a phone */
  .split{display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1fr);gap:38px;align-items:start}
  @media(max-width:820px){.split{grid-template-columns:1fr;gap:26px}}
  .shot{position:relative;border-radius:4px;overflow:hidden;background:var(--ink)}
  .shot img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5}
  .shot .tag{position:absolute;left:0;bottom:0;right:0;padding:15px 17px;color:#fff;
    background:linear-gradient(0deg,rgba(11,11,12,.9),transparent)}
  .shot .tag b{display:block;font-family:"Anton",Impact,sans-serif;font-size:19px;letter-spacing:.02em;
    text-transform:uppercase}
  .shot .tag span{font-size:14px;color:#c4c6ca}
  .story p{color:var(--text-2);font-size:17px;margin:0 0 15px}
  .story p:first-child{font-size:19px;color:var(--text)}
  .story h2{margin:30px 0 10px;font-size:clamp(22px,4.2vw,28px)}

  /* the two of us */
  .who{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px}
  @media(max-width:640px){.who{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--red);
    border-radius:3px;padding:21px 22px}
  .card .role{font-family:"Anton",Impact,sans-serif;font-size:12px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--red-dark);margin-bottom:6px}
  .card h3{font-size:21px;margin-bottom:7px}
  .card p{margin:0;color:var(--text-2);font-size:15.5px}

  /* what we will and won't do — the honest bit */
  .vows{display:grid;gap:0;max-width:830px;border:1px solid var(--line-d);border-radius:4px;
    overflow:hidden}
  .vow{display:grid;grid-template-columns:34px 1fr;gap:15px;padding:17px 20px;align-items:start}
  .vow + .vow{border-top:1px solid var(--line-d)}
  .vow .m{width:26px;height:26px;flex:none;border-radius:3px;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:700;background:var(--red);color:#fff}
  .vow.no .m{background:#2a2b2e;color:#8d9095}
  .vow b{display:block;font-size:16.5px;margin-bottom:3px;color:#fff}
  .vow p{margin:0;color:#a9abb0;font-size:15px}

  section.paper .rule{justify-content:flex-start}
  section.paper .rule .streak.r{display:none}
  .close{text-align:center;max-width:640px;margin:0 auto}
  .close h2{margin-bottom:11px}
  .close p{color:var(--text-2);font-size:17px;margin:0 0 22px}
  .cbtns{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
  @media(max-width:460px){.cbtns{flex-direction:column}.cbtns .btn{width:100%}}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<header id="hdr"></header>

<div class="phead ahead">
  <div class="tex"><img src="/img/streaks.jpg" alt="" width="1600" height="800"></div>
  <div class="wrap">
    <span class="eyebrow" data-t="eyebrow">About us</span>
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="split">
      <div class="shot">
        <img src="/img/driver.jpg" alt="" loading="lazy" width="760" height="1188">
        <div class="tag"><b data-t="tag_b"></b><span data-t="tag_s"></span></div>
      </div>
      <div class="story">
        <p data-t="s1"></p>
        <p data-t="s2"></p>
        <h2 data-t="s3_h"></h2>
        <p data-t="s3"></p>
        <p data-t="s4"></p>
      </div>
    </div>
  </div>
</section>

<section class="paper">
  <div class="wrap">
    <div class="rule"><span class="streak"><i></i><i></i><i></i></span><h2 data-t="who_h"></h2><span class="streak r"><i></i><i></i><i></i></span></div>
    <p class="lede" data-t="who_sub" style="color:var(--text-2);font-size:17px;margin:0 0 26px"></p>
    <div class="who">
      <div class="card"><div class="role" data-t="p1_r"></div><h3 data-t="p1_n"></h3><p data-t="p1_p"></p></div>
      <div class="card"><div class="role" data-t="p2_r"></div><h3 data-t="p2_n"></h3><p data-t="p2_p"></p></div>
    </div>
  </div>
</section>

<section class="dark">
  <div class="wrap">
    <span class="eyebrow" data-t="vow_eye"></span>
    <h2 data-t="vow_h" style="margin-bottom:11px"></h2>
    <p data-t="vow_sub" style="margin:0 0 26px;max-width:60ch"></p>
    <div class="vows">
      <div class="vow"><span class="m">&#10003;</span><div><b data-t="v1_h"></b><p data-t="v1_p"></p></div></div>
      <div class="vow"><span class="m">&#10003;</span><div><b data-t="v2_h"></b><p data-t="v2_p"></p></div></div>
      <div class="vow"><span class="m">&#10003;</span><div><b data-t="v3_h"></b><p data-t="v3_p"></p></div></div>
      <div class="vow no"><span class="m">&#10005;</span><div><b data-t="v4_h"></b><p data-t="v4_p"></p></div></div>
      <div class="vow no"><span class="m">&#10005;</span><div><b data-t="v5_h"></b><p data-t="v5_p"></p></div></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="close">
      <h2 data-t="cl_h"></h2>
      <p data-t="cl_p"></p>
      <div class="cbtns">
        <a class="btn" data-href="/drivers" data-t="cl_drv"></a>
        <a class="btn dark" data-href="/carriers" data-t="cl_car"></a>
      </div>
    </div>
  </div>
</section>

<nav class="callbar" id="callbar" hidden></nav>
<footer id="ftr"></footer>

<script src="/site.js"></script>
<script>

if (window.CONTACT && window.CONTACT.phone) document.body.classList.add('hascallbar');
paintPage();

</body>
</html>
