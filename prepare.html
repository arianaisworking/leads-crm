<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your travel & preparedness plan</title>
<style>
  :root{--bg:#eef1f6;--ink:#1a2230;--soft:#5b6472;--line:#e6ebf2;--brand:#2f6fed;--wash:#eef3fe;--ok:#12704c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 14px}
  .wrap{max-width:600px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 20px rgba(20,30,50,.06);padding:22px 22px;margin-bottom:14px}
  .brand{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
  h1{font-size:23px;margin:0 0 4px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);margin:0 0 10px}
  .sub{color:var(--soft);font-size:14px}
  .addr{font-weight:600}
  .mapwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:12px;aspect-ratio:16/10}
  .mapwrap iframe{width:100%;height:100%;border:0;display:block}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
  .btn.block{display:block;width:100%}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.6}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .opt input{margin-top:2px;width:18px;height:18px;flex:none}
  .opt .t{font-weight:600}.opt .d{font-size:12.5px;color:var(--soft)}
  label.fld{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin:12px 0 5px}
  input.txt,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
  .flag{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;font-size:13.5px}
  .msg{text-align:center;padding:50px 20px;color:var(--soft)}
  .check{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
  .err{color:#b3452f;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="msg">Loading…</div></div></div>
<script>
const TOKEN=new URLSearchParams(location.search).get("token")||"";
const app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function msg(h){app.innerHTML=`<div class="card"><div class="msg">${h}</div></div>`;}

async function boot(){
  if(!TOKEN) return msg("<h2>Invalid link</h2><p>This link is missing its code.</p>");
  let d; try{ const r=await fetch("/api/intake/prepare-info?token="+encodeURIComponent(TOKEN)); d=await r.json(); if(!r.ok) return msg(esc(d.error||"This link is invalid.")); }
  catch(e){ return msg("Connection issue — please try again."); }
  render(d);
}

function render(d){
  const c=d.clinic||{}, cx=d.concierge||{};
  const first=d.patient_name?esc(d.patient_name.split(" ")[0]):"";
  const mapQ=c.address||[c.name,c.city].filter(Boolean).join(", ")||c.city||"";
  const hotelQ=encodeURIComponent("hotels near "+(c.address||c.city||c.name||""));
  const ck=(v)=>v?"checked":"";
  app.innerHTML=`
    <div class="card">
      <div class="brand">MXN Cells · Travel & preparedness</div>
      <h1>Getting ready for your visit${first?", "+first:""}</h1>
      <p class="sub">Everything you need to prepare for your treatment${c.city?" in "+esc(c.city):""}. We're here to make the trip easy.</p>
      ${d.travel_dates?`<p class="sub" style="margin-top:8px"><b>Your travel:</b> ${esc(d.travel_dates)}${d.travel_confirmed?" ✓ confirmed":""}</p>`:""}
    </div>

    ${c.name?`<div class="card">
      <h2>Your clinic</h2>
      <div class="addr">${esc(c.name)}</div>
      ${c.address?`<div class="sub">${esc(c.address)}</div>`:""}
      ${c.phone?`<div class="sub">📞 ${esc(c.phone)}</div>`:""}
      ${mapQ?`<div class="mapwrap"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(mapQ)}&output=embed"></iframe></div>`:""}
      ${mapQ?`<a class="btn ghost block" style="margin-top:10px" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapQ)}" target="_blank" rel="noopener">Get directions ↗</a>`:""}
    </div>`:""}

    <div class="card flag">
      🛂 <b>Passport check.</b> Please make sure your passport is valid for at least <b>6 months</b> beyond your travel dates, and pack it for the trip.
    </div>

    <div class="card">
      <h2>Where to stay</h2>
      <p class="sub" style="margin-bottom:10px">We can arrange lodging for you, or you can browse hotels near the clinic.</p>
      <a class="btn ghost block" href="https://www.google.com/maps/search/${hotelQ}" target="_blank" rel="noopener">🏨 See hotels near the clinic ↗</a>
    </div>

    <div class="card">
      <h2>Let us help you plan</h2>
      <p class="sub" style="margin-bottom:12px">Check anything you'd like us to arrange — we'll take care of the details.</p>
      <label class="opt"><input type="checkbox" id="cLodging" ${ck(cx.lodging)}><span><span class="t">Lodging</span><br><span class="d">Book a hotel or stay near the clinic</span></span></label>
      <label class="opt"><input type="checkbox" id="cMeals" ${ck(cx.meals)}><span><span class="t">Meals</span><br><span class="d">Meal planning / delivery during your stay</span></span></label>
      <label class="opt"><input type="checkbox" id="cAirport" ${ck(cx.airport)}><span><span class="t">Airport pick-up & drop-off</span><br><span class="d">Transfers between the airport, hotel and clinic</span></span></label>
      <label class="opt"><input type="checkbox" id="cAfter" ${ck(cx.aftercare)}><span><span class="t">Aftercare support</span><br><span class="d">Help arranging recovery care after your treatment</span></span></label>
      <label class="opt"><input type="checkbox" id="cNurse" ${ck(cx.nurse)}><span><span class="t">In-home / hotel nurse</span><br><span class="d">A nurse to check in on you during recovery</span></span></label>

      <label class="fld">Flight or arrival details (optional)</label>
      <input class="txt" id="cFlight" placeholder="e.g. arriving PVR Sept 9, 2:15pm on AA1234" value="${esc(cx.flight||"")}">
      <label class="fld">Anything else we should know?</label>
      <textarea id="cNotes" placeholder="Mobility needs, travel companions, dietary needs, questions…">${esc(cx.notes||"")}</textarea>

      <button class="btn block" id="send" style="margin-top:14px">Send my requests →</button>
      <div class="err" id="err"></div>
      <div class="sub" id="okmsg" style="text-align:center;margin-top:10px"></div>
    </div>`;
  document.getElementById("send").onclick=submit;
}

async function submit(){
  const body={
    lodging:document.getElementById("cLodging").checked,
    meals:document.getElementById("cMeals").checked,
    airport:document.getElementById("cAirport").checked,
    aftercare:document.getElementById("cAfter").checked,
    nurse:document.getElementById("cNurse").checked,
    flight:document.getElementById("cFlight").value,
    notes:document.getElementById("cNotes").value,
  };
  const btn=document.getElementById("send"), err=document.getElementById("err"); err.textContent="";
  btn.disabled=true; btn.textContent="Sending…";
  try{ const r=await fetch("/api/intake/prepare?token="+encodeURIComponent(TOKEN),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||"Could not send.");
    document.getElementById("okmsg").innerHTML=`<span style="color:#12704c;font-weight:700">✓ Sent! Our team will be in touch to coordinate everything.</span>`;
    btn.textContent="Update my requests";
  }catch(e){ err.textContent=e.message; }
  btn.disabled=false;
}
boot();
</script>
</body>
</html>
