name = "aiw-recruiting-nudge"
main = "worker.js"
compatibility_date = "2024-11-01"

# 9am and 4pm UTC — twice a day is enough for follow-ups, and the endpoint
# rate-limits per driver anyway (no repeat inside 3 days, 3 sends maximum).
[triggers]
crons = ["0 9 * * *", "0 16 * * *"]

# Optional: uncomment and set if the app moves to a custom domain.
