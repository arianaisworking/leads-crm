  .nav .ic{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:.14s}
  .nav .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nav button .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-soft);background:rgba(27,22,32,.06);border-radius:20px;padding:1px 9px;min-width:24px;text-align:center}
  .nav button:hover{background:rgba(255,255,255,.6)}
  .nav button.on{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(237,26,120,.32)}
  .nav button.on .ic{background:#fff;color:var(--pink)}
  .nav button.on .ct{background:rgba(255,255,255,.24);color:#fff}
  .player{margin-top:auto;background:linear-gradient(160deg,#fffdf9,#fdf1f6);border:1px solid var(--line);border-radius:16px;padding:9px 9px 7px;box-shadow:0 2px 10px rgba(27,22,32,.07)}
  .player .pl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--pink);padding:2px 4px 4px;display:flex;align-items:center;gap:6px}
  .turntable{position:relative;height:128px;display:grid;place-items:center;margin:2px 0 4px}
  .vinyl{width:116px;height:116px;border-radius:50%;position:relative;
    background:repeating-radial-gradient(circle at 50% 50%, #17131c 0 3px, #241d29 3px 4px);
    box-shadow:0 5px 14px rgba(0,0,0,.28), inset 0 0 0 2px #2c2530;animation:spin 3.4s linear infinite}
  .vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(255,255,255,.16), transparent 22%, rgba(255,255,255,.09) 50%, transparent 74%, rgba(255,255,255,.16))}
  .vinyl .label{position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #ff7ab0, #ed1a78 60%, #c60f63);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .vinyl .label::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
  .arm{position:absolute;top:0;right:4px;pointer-events:none;z-index:3}
  @keyframes spin{to{transform:rotate(360deg)}}
  .player iframe{width:100%;border:0;border-radius:11px;display:block}
  .side .foot{margin-top:12px;font-size:10.5px;color:var(--ink-soft);line-height:1.55;padding:12px 10px 0;background:rgba(247,241,232,.6);border-radius:12px}

  /* ---- Main ---- */
  .main{padding:30px 38px 60px;max-width:1200px}
  .hero{position:relative;margin:4px 0 26px}
  .hero .ticks{position:absolute;left:-2px;top:-18px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.02;margin:0;letter-spacing:-.01em;position:relative;display:inline-block}
  .hero h1 .swash{position:absolute;left:0;right:-4px;bottom:-12px;height:16px}
  .hero p{margin:16px 0 0;color:var(--ink-soft);font-size:15px;font-weight:500}
  .spark{position:absolute;pointer-events:none}

  .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .head .eyebrow{margin-bottom:3px}
  .head h2{font-family:var(--serif);margin:0;font-size:25px;font-weight:600;letter-spacing:-.01em}

  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  .stat{flex:1;min-width:104px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:7px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .stat.due{background:linear-gradient(135deg,var(--pink),#ff5aa0);border:0;color:#fff}
  .stat.due .n{color:#fff} .stat.due .l{color:rgba(255,255,255,.85)}

  .bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  input,select{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 13px;outline:none;transition:.14s}
  input::placeholder{color:var(--ink-faint)}
  input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-wash)}
  .search{flex:1;min-width:190px}
  .btn{background:var(--pink);color:#fff;border:0;border-radius:40px;padding:10px 20px;font-size:13.5px;font-weight:600;transition:.14s;box-shadow:0 6px 16px rgba(237,26,120,.28)}
  .btn:hover{background:var(--pink-deep)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--pink);color:var(--pink-deep)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);text-align:left;
    padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer;transition:.1s}
  tbody tr:hover{background:var(--pink-tint)}
  .biz{display:flex;align-items:center;gap:11px}
  .name{font-weight:600;letter-spacing:-.005em}
  .sub{color:var(--ink-soft);font-size:12px}
  .av{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 4px rgba(0,0,0,.08)}
  .av.sm{width:30px;height:30px;font-size:11px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .pill.New{background:#f1e8fb;color:var(--new)} .pill.Contacted{background:var(--peri-wash);color:var(--contacted)}
  .pill.Qualified{background:#fdeede;color:#d97a1e} .pill.Client{background:#e0f6ee;color:#279a6c}
  .pill.Dead{background:#efe9ec;color:var(--dead)}
  .trade{font-size:11.5px;color:var(--ink-soft);text-transform:capitalize}

  /* Pipeline */
  .kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;align-items:start}
  .col{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;padding:11px;min-height:130px;backdrop-filter:blur(2px)}
  .col h3{margin:2px 4px 12px;font-size:12px;letter-spacing:.01em;color:var(--ink);display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .col h3 .c{font-size:11px;font-weight:700;color:#fff;background:var(--pink);border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
  .col[data-status="Contacted"] h3 .c{background:var(--peri)} .col[data-status="Qualified"] h3 .c{background:var(--qualified)}
  .col[data-status="Client"] h3 .c{background:var(--client)} .col[data-status="Dead"] h3 .c{background:var(--dead)}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;cursor:grab;transition:.12s;box-shadow:0 2px 5px rgba(27,22,32,.05);display:flex;gap:10px;align-items:center}
  .kcard:hover{border-color:var(--pink);transform:translateY(-2px)}
  .kcard .name{font-size:13px} .kcard .sub{margin-top:2px}
  .col.drop{outline:2px dashed var(--pink);outline-offset:-4px;background:var(--pink-wash)}

  /* Empty */
  .empty{text-align:center;padding:60px 24px}
  .empty .mark{font-size:34px;margin-bottom:8px}
  .empty h3{font-family:var(--serif);color:var(--ink);font-size:22px;font-weight:600;margin:0 0 8px}
  .empty p{margin:0 auto 20px;max-width:430px;font-size:14px;line-height:1.6;color:var(--ink-soft)}

  /* Drawer */
  .scrim{position:fixed;inset:0;background:rgba(27,22,32,.4);opacity:0;pointer-events:none;transition:.18s;z-index:9}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(452px,92vw);background:var(--card);box-shadow:-14px 0 44px rgba(27,22,32,.2);
    transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);overflow-y:auto;z-index:10}
  .drawer.show{transform:translateX(0)}
  .dhead{padding:24px 24px 20px;border-bottom:1px solid var(--line);background:var(--pink-tint);position:relative;display:flex;gap:13px;align-items:center}
  .dhead .name{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
  .dclose{position:absolute;top:16px;right:16px;background:rgba(27,22,32,.06);border:0;width:30px;height:30px;border-radius:9px;font-size:15px;color:var(--ink-soft)}
  .dclose:hover{background:rgba(27,22,32,.12)}
  .dbody{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--pink)}
  .field .val{font-size:14px}
  .drow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .notes-list{display:flex;flex-direction:column;gap:8px}
  .note{background:var(--pink-tint);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5}
  .note .t{font-size:11px;color:var(--ink-faint);margin-top:6px}
  .noteadd{display:flex;gap:8px}.noteadd input{flex:1}
  .del{background:none;border:0;color:var(--dead);font-size:12px;text-decoration:underline;padding:0;margin-top:4px;align-self:flex-start}
  .del:hover{color:var(--pink-deep)}

  /* Find Leads */
  .finder{display:grid;gap:20px;max-width:580px}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--card);transition:.12s}
  .check span{text-transform:capitalize;font-weight:600}
  .check input{width:17px;height:17px;accent-color:var(--pink)}
  .check.on{border-color:var(--pink);background:var(--pink-wash)}
  .result{font-family:var(--serif);font-size:17px;font-weight:600;padding:16px 18px;border-radius:14px;background:var(--pink-wash);color:var(--pink-deep)}
  .muted{color:var(--ink-soft);font-size:12.5px;line-height:1.6}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:column;background-size:cover}
    .logo{margin-bottom:14px}
    .nav{flex-direction:row;flex-wrap:wrap;gap:6px}.nav button{width:auto}.nav button .ct{display:none}
    .side .foot{display:none}
    .kanban{grid-template-columns:1fr}
    .main{padding:22px}.hero h1{font-size:32px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const API = "/api";

const SPOTIFY_PLAYLIST = "6DmrkQbB4S6zYnm49QkhpJ";
const STATUSES = ["New","Contacted","Qualified","Client","Dead"];

const TRADE_COLOR={roofing:"#f5943b",plumbing:"#8288ea",electrical:"#ed1a78",hvac:"#2bb5c4"};
const POOL=["#ed1a78","#8288ea","#f5943b","#35c08a","#9b6be0","#2bb5c4"];
const STATES = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","District of Columbia","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];

let state = { view:"database", leads:[], stats:{}, q:"", fTrade:"", fState:"", fStatus:"" };

const $ = (s,r=document)=>r.querySelector(s);
const esc = (s)=> (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function initials(n){const w=(n||"?").replace(/[^a-zA-Z ]/g,"").trim().split(/\s+/);return ((w[0]?.[0]||"")+(w[1]?.[0]||"")).toUpperCase()||"?";}
function avColor(l){ if(l.trade&&TRADE_COLOR[l.trade])return TRADE_COLOR[l.trade]; let h=0; for(const c of (l.name||"")) h=(h*31+c.charCodeAt(0))>>>0; return POOL[h%POOL.length]; }
function avatar(l,sm){return `<span class="av${sm?' sm':''}" style="background:${avColor(l)}">${esc(initials(l.name))}</span>`;}

const _SAMPLE=[
 {id:1,name:"Lone Star Roofing Co.",trade:"roofing",phone:"(214) 555-0142",email:null,website:"https://lonestarroof.com",address:"1820 Elm St",city:"Dallas",state:"Texas",postcode:"75201",status:"New",next_touch:null},
 {id:2,name:"BlueFlame Plumbing",trade:"plumbing",phone:"(469) 555-0199",email:"hi@blueflameplumb.com",website:null,address:"77 Cedar Springs",city:"Dallas",state:"Texas",postcode:"75219",status:"Contacted",next_touch:"2026-08-12"},
 {id:3,name:"Corradetti Electric",trade:"electrical",phone:"(972) 555-0110",email:null,website:"https://corradettielectric.com",address:"305 Main",city:"Plano",state:"Texas",postcode:"75074",status:"Qualified",next_touch:"2026-08-09"},
 {id:4,name:"North TX Comfort HVAC",trade:"hvac",phone:"(817) 555-0173",email:"team@ntxcomfort.com",website:"https://ntxcomfort.com",address:"12 Airport Fwy",city:"Fort Worth",state:"Texas",postcode:"76102",status:"Client",next_touch:null},
 {id:5,name:"Alamo Ridge Roofing",trade:"roofing",phone:"(210) 555-0128",email:null,website:null,address:"900 Broadway",city:"San Antonio",state:"Texas",postcode:"78215",status:"New",next_touch:null},
 {id:6,name:"Bayou City Plumbers",trade:"plumbing",phone:"(713) 555-0164",email:"book@bayoucityplumb.com",website:"https://bayoucityplumb.com",address:"44 Heights Blvd",city:"Houston",state:"Texas",postcode:"77007",status:"Contacted",next_touch:"2026-08-08"},
 {id:7,name:"Capitol Wiring & Electric",trade:"electrical",phone:"(512) 555-0187",email:null,website:null,address:"210 Congress Ave",city:"Austin",state:"Texas",postcode:"78701",status:"Client",next_touch:null},
 {id:8,name:"Summit Air Solutions",trade:"hvac",phone:"(214) 555-0155",email:null,website:"https://summitair.co",address:"1500 Ross Ave",city:"Dallas",state:"Texas",postcode:"75202",status:"Qualified",next_touch:"2026-08-07"}];
const _STATS={total:24,new:9,contacted:6,qualified:4,client:3,dead:2,due:3};
async function api(path,opts){await new Promise(r=>setTimeout(r,50));
 if(path.startsWith("/stats"))return _STATS;
 if(path.startsWith("/leads")){const u=new URLSearchParams(path.split("?")[1]||"");let rows=_SAMPLE.slice();
  if(u.get("status"))rows=rows.filter(r=>r.status===u.get("status"));
  if(u.get("trade"))rows=rows.filter(r=>r.trade===u.get("trade"));
  if(u.get("state"))rows=rows.filter(r=>r.state===u.get("state"));
  if(u.get("due")==="1")rows=rows.filter(r=>r.next_touch&&r.next_touch<="2026-08-10");
  if(u.get("q")){const q=u.get("q").toLowerCase();rows=rows.filter(r=>(r.name+r.city+(r.phone||"")+(r.email||"")).toLowerCase().includes(q));}
  if(path.includes("/notes"))return [{id:1,body:"Left a voicemail — try Thursday AM.",created_at:"2026-08-08 14:20"}];
  return rows;}
 return {ok:true,inserted:0,found:0,skipped:0};}
async function loadStats(){
  try{ state.stats = await api("/stats"); }catch(e){ state.stats={}; }
  const s=state.stats;
  $("#ct-database").textContent=s.total||0; $("#ct-clients").textContent=s.client||0; $("#ct-nurture").textContent=s.due||0;
}
async function loadLeads(params={}){
  const qs=new URLSearchParams(params).toString();
  state.leads=await api("/leads"+(qs?"?"+qs:""));
}

  const h=new Date().getHours();

    <p>Your leads are moving.</p>`;
}

function setView(v){ state.view=v; document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===v)); render(); }
async function render(){
  const m=$("#view"); await loadStats();
  if(state.view==="database") return renderDatabase(m);
  if(state.view==="pipeline") return renderPipeline(m);
  if(state.view==="clients") return renderList(m,"Clients","Won","The businesses you've won.",{status:"Client"});
  if(state.view==="nurture") return renderList(m,"Nurture","Follow up","Follow-ups due today or overdue.",{due:"1"});
  if(state.view==="finder") return renderFinder(m);
}

function statCards(){
  const s=state.stats;
  return `<div class="stats">
    <div class="stat"><div class="n">${s.total||0}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${s.new||0}</div><div class="l">New</div></div>
    <div class="stat"><div class="n">${s.contacted||0}</div><div class="l">Contacted</div></div>
    <div class="stat"><div class="n">${s.qualified||0}</div><div class="l">Qualified</div></div>
    <div class="stat"><div class="n">${s.client||0}</div><div class="l">Clients</div></div>
    <div class="stat due"><div class="n">${s.due||0}</div><div class="l">Due</div></div>
  </div>`;
}
function head(eyebrow,title,right=""){return `<div class="head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div>${right}</div>`;}

async function renderDatabase(m){
  m.innerHTML = head("The book","Database",`<button class="btn ghost" id="addBtn">+ Add lead</button>`)
    + statCards()
    + `<div class="bar">
        <input class="search" id="q" placeholder="Search name, city, phone, email…" value="${esc(state.q)}">
        <select id="fTrade"><option value="">All trades</option>${TRADES.map(t=>`<option ${state.fTrade===t?"selected":""}>${t}</option>`).join("")}</select>
        <select id="fState"><option value="">All states</option>${STATES.map(s=>`<option ${state.fState===s?"selected":""}>${s}</option>`).join("")}</select>
        <select id="fStatus"><option value="">All statuses</option>${STATUSES.map(s=>`<option ${state.fStatus===s?"selected":""}>${s}</option>`).join("")}</select>
      </div><div id="tbl"></div>`;
  const draw=async()=>{
    const p={}; if(state.q)p.q=state.q; if(state.fTrade)p.trade=state.fTrade; if(state.fState)p.state=state.fState; if(state.fStatus)p.status=state.fStatus;
    await loadLeads(p);
    $("#tbl").innerHTML=leadTable(state.leads,"✦","Nothing here yet","Head to <b>Find Leads</b> and pull in some skilled-trades businesses to get started.");
    wireRows();
  };
  let t; $("#q").oninput=(e)=>{state.q=e.target.value;clearTimeout(t);t=setTimeout(draw,250)};
  $("#fTrade").onchange=(e)=>{state.fTrade=e.target.value;draw()};
  $("#fState").onchange=(e)=>{state.fState=e.target.value;draw()};
  $("#fStatus").onchange=(e)=>{state.fStatus=e.target.value;draw()};
  $("#addBtn").onclick=openAdd;
  await draw();
}

function leadTable(rows,mark,eh,ep){
  if(!rows.length) return `<div class="card"><div class="empty"><div class="mark">${mark}</div><h3>${eh}</h3><p>${ep}</p>
    <button class="btn" onclick="setView('finder')">Go to Find Leads</button></div></div>`;
  return `<div class="card"><table><thead><tr>
      <th>Business</th><th>Location</th><th>Contact</th><th>Status</th><th>Next touch</th>
    </tr></thead><tbody>${rows.map(r=>`
      <tr data-id="${r.id}">
        <td><div class="biz">${avatar(r)}<div><div class="name">${esc(r.name)}</div><div class="sub trade">${esc(r.trade||"—")}</div></div></div></td>
        <td>${esc([r.city,r.state].filter(Boolean).join(", ")||"—")}</td>
        <td>${esc(r.phone||r.email||"—")}</td>
        <td><span class="pill ${r.status}">${r.status}</span></td>
        <td class="sub">${esc(r.next_touch||"—")}</td>
      </tr>`).join("")}</tbody></table></div>`;
}

async function renderList(m,title,eyebrow,sub,params){
  m.innerHTML=head(eyebrow,title)+statCards()+`<p class="muted" style="margin:-8px 0 16px">${sub}</p><div id="tbl"></div>`;
  await loadLeads(params);
  const map={Clients:["🎉","No clients yet","Open a lead and set its status to <b>Client</b> once they sign on — they'll gather here."],
             Nurture:["✓","All caught up","Give a lead a <b>next touch</b> date and it'll show up here when it's time to follow up."]};
  const [mk,eh,ep]=map[title]||["✦","Nothing here",""];
  $("#tbl").innerHTML=leadTable(state.leads,mk,eh,ep); wireRows();
}

async function renderPipeline(m){
  m.innerHTML=head("The board","Pipeline")+statCards()+`<p class="muted" style="margin:-8px 0 16px">Drag a card between stages to move a lead along.</p><div class="kanban" id="kb"></div>`;
  await loadLeads({});
  const kb=$("#kb");
  kb.innerHTML=STATUSES.map(s=>{
    const rows=state.leads.filter(r=>r.status===s);
    return `<div class="col" data-status="${s}"><h3>${s} <span class="c">${rows.length}</span></h3>
      ${rows.map(r=>`<div class="kcard" draggable="true" data-id="${r.id}">${avatar(r,true)}
        <div><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.trade||"")}${r.city?" · "+esc(r.city):""}</div></div></div>`).join("")}</div>`;
  }).join("");
  let dragId=null;
  kb.querySelectorAll(".kcard").forEach(c=>{
    c.addEventListener("dragstart",()=>{dragId=c.dataset.id;});
    c.addEventListener("click",()=>openLead(parseInt(c.dataset.id,10)));
  });
  kb.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drop");});
    col.addEventListener("dragleave",()=>col.classList.remove("drop"));
    col.addEventListener("drop",async e=>{
      e.preventDefault();col.classList.remove("drop"); if(!dragId)return;
      await api("/leads/"+dragId,{method:"PATCH",headers:{"content-type":"application/json"},
        body:JSON.stringify({status:col.dataset.status,last_contacted:new Date().toISOString().slice(0,10)})});
      dragId=null; renderPipeline(m);
    });
  });
}

function wireRows(){ document.querySelectorAll("tbody tr[data-id]").forEach(tr=>{tr.onclick=()=>openLead(parseInt(tr.dataset.id,10));}); }

function closeDrawer(){$("#drawer").classList.remove("show");$("#scrim").classList.remove("show");}
$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

async function openLead(id){
  const lead=state.leads.find(l=>l.id===id)||await api("/leads?q="+id).then(a=>a.find(l=>l.id===id));
  if(!lead)return;
  const d=$("#drawer");
  d.innerHTML=`
    <button class="dclose" onclick="closeDrawer()">✕</button>
    <div class="dhead">${avatar(lead)}<div><div class="name">${esc(lead.name)}</div>
      <div class="sub" style="margin-top:2px">${esc([lead.trade,lead.city,lead.state].filter(Boolean).join(" · ")||"")}</div></div></div>
    <div class="dbody">
      <div class="drow">
        <div class="field"><label>Status</label><select id="dStatus">${STATUSES.map(s=>`<option ${lead.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
        <div class="field"><label>Next touch</label><input type="date" id="dNext" value="${esc(lead.next_touch||"")}"></div>
      </div>
      <div class="field"><label>Phone</label><input id="dPhone" value="${esc(lead.phone||"")}" placeholder="Add phone"></div>
      <div class="field"><label>Email</label><input id="dEmail" value="${esc(lead.email||"")}" placeholder="Add email"></div>
      <div class="field"><label>Website</label><div class="val">${lead.website?`<a href="${esc(lead.website)}" target="_blank" rel="noopener">${esc(lead.website.replace(/^https?:\/\//,""))}</a>`:'<span class="sub">—</span>'}</div></div>
      <div class="field"><label>Address</label><div class="val sub">${esc([lead.address,lead.city,lead.state,lead.postcode].filter(Boolean).join(", ")||"—")}</div></div>
      <button class="btn" id="dSave">Save changes</button>
      <div class="field"><label>Notes</label><div class="notes-list" id="dNotes"><div class="sub">Loading…</div></div>
        <div class="noteadd" style="margin-top:8px"><input id="dNoteInput" placeholder="Add a note…"><button class="btn ghost" id="dNoteBtn">Add</button></div></div>
      <button class="del" id="dDelete">Delete this lead</button>
    </div>`;
  $("#scrim").classList.add("show"); d.classList.add("show");
  $("#dSave").onclick=async()=>{
    const body={status:$("#dStatus").value,next_touch:$("#dNext").value||null,phone:$("#dPhone").value||null,email:$("#dEmail").value||null};
    await api("/leads/"+id,{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    closeDrawer(); render();
  };
  $("#dDelete").onclick=async()=>{ if(!confirm("Delete "+lead.name+"? This can't be undone."))return;
    await api("/leads/"+id,{method:"DELETE"}); closeDrawer(); render(); };
  loadNotes(id);
  $("#dNoteBtn").onclick=async()=>{ const v=$("#dNoteInput").value.trim(); if(!v)return;
    await api("/leads/"+id+"/notes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({body:v})});
    $("#dNoteInput").value=""; loadNotes(id); };
}
async function loadNotes(id){
  const notes=await api("/leads/"+id+"/notes");
  $("#dNotes").innerHTML=notes.length?notes.map(n=>`<div class="note">${esc(n.body)}<div class="t">${esc(n.created_at)}</div></div>`).join(""):`<div class="sub">No notes yet.</div>`;
}

function openAdd(){
  const d=$("#drawer");
  d.innerHTML=`<button class="dclose" onclick="closeDrawer()">✕</button>
    <div class="dhead"><span class="av" style="background:var(--peri)">+</span><div><div class="name">Add a lead</div><div class="sub" style="margin-top:2px">Manual entry</div></div></div>
    <div class="dbody">
      <div class="field"><label>Business name *</label><input id="aName" placeholder="Required"></div>
      <div class="drow">
        <div class="field"><label>Trade</label><select id="aTrade"><option value="">—</option>${TRADES.map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div class="field"><label>State</label><select id="aState"><option value="">—</option>${STATES.map(s=>`<option>${s}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>City</label><input id="aCity"></div>
      <div class="field"><label>Phone</label><input id="aPhone"></div>
      <div class="field"><label>Email</label><input id="aEmail"></div>
      <div class="field"><label>Website</label><input id="aWebsite"></div>
      <button class="btn" id="aSave">Add lead</button>
    </div>`;
  $("#scrim").classList.add("show"); d.classList.add("show");
  $("#aSave").onclick=async()=>{
    const name=$("#aName").value.trim(); if(!name){$("#aName").focus();return;}
    await api("/leads",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
      name,trade:$("#aTrade").value||null,state:$("#aState").value||null,city:$("#aCity").value||null,
      phone:$("#aPhone").value||null,email:$("#aEmail").value||null,website:$("#aWebsite").value||null})});
    closeDrawer(); render();
  };
}

function renderFinder(m){
  m.innerHTML=head("Fresh leads","Find Leads")
    + `<div class="finder">
        <p class="muted" style="margin-top:-6px">Pull real skilled-trades businesses from OpenStreetMap straight into your book.</p>
        <div class="field"><label>Trades</label><div class="checks" id="checks">
          ${TRADES.map(t=>`<label class="check" data-t="${t}"><input type="checkbox" value="${t}"><span>${t}</span></label>`).join("")}
        </div></div>
        <div class="field"><label>State</label>
          <select id="scState"><option value="">Choose a state…</option>${STATES.map(s=>`<option>${s}</option>`).join("")}</select></div>
        <button class="btn" id="scGo">Find leads</button>
        <div id="scResult"></div>
        <p class="muted">Only named businesses come in, and duplicates are skipped automatically. Coverage depends on what's mapped in OpenStreetMap — busy metros return the most. This finds businesses; it doesn't check licensing or consent to contact.</p>
      </div>`;
  document.querySelectorAll("#checks .check").forEach(c=>{const cb=c.querySelector("input");
    c.onclick=(e)=>{ if(e.target!==cb)cb.checked=!cb.checked; c.classList.toggle("on",cb.checked); };});
  $("#scGo").onclick=async()=>{
    const trades=[...document.querySelectorAll("#checks input:checked")].map(i=>i.value);
    const stateName=$("#scState").value; const box=$("#scResult");
    if(!trades.length){box.innerHTML=`<div class="result">Pick at least one trade.</div>`;return;}
    if(!stateName){box.innerHTML=`<div class="result">Choose a state.</div>`;return;}
    const btn=$("#scGo"); btn.disabled=true; const orig=btn.textContent;
    btn.innerHTML=`<span class="spin"></span>Searching ${esc(stateName)}…`;
    box.innerHTML=`<p class="muted">Querying OpenStreetMap — a statewide search can take up to a minute.</p>`;
    try{
      const r=await api("/scrape",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({trades,state:stateName})});
      box.innerHTML=`<div class="result">Added ${r.inserted} new lead${r.inserted===1?"":"s"} from ${esc(stateName)} · ${r.found} found · ${r.skipped} skipped.</div>`;
    }catch(e){ box.innerHTML=`<div class="result">${esc(e.message)}</div>`; }
    finally{ btn.disabled=false; btn.textContent=orig; loadStats(); }
  };
}
