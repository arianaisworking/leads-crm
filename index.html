  .side::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,241,232,.28),rgba(247,241,232,.5) 42%,rgba(247,241,232,.28));z-index:-1}
  .logo{display:block;width:150px;margin:2px auto 26px}
  .logo img{width:100%;height:auto;display:block}
  .nav{display:flex;flex-direction:column;gap:5px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--ink);
    padding:9px 12px 9px 9px;border-radius:40px;font-size:14px;font-weight:600;transition:.14s}
  .nav .ic{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:.14s}
  .nav .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nav button .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-soft);background:rgba(27,22,32,.06);border-radius:20px;padding:1px 9px;min-width:24px;text-align:center}
  .nav button:hover{background:rgba(255,255,255,.6)}
  .nav button.on{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(237,26,120,.32)}
  .nav button.on .ic{background:#fff;color:var(--pink)}
  .nav button.on .ct{background:rgba(255,255,255,.24);color:#fff}
  .player{margin-top:auto;background:linear-gradient(160deg,#fffdf9,#fdf1f6);border:1px solid var(--line);border-radius:16px;padding:9px 9px 7px;box-shadow:0 2px 10px rgba(27,22,32,.07)}
  .player .pl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--pink);padding:2px 4px 4px;display:flex;align-items:center;gap:6px}
  .turntable{position:relative;height:128px;display:grid;place-items:center;margin:2px 0 4px}
  .vinyl{width:116px;height:116px;border-radius:50%;position:relative;
    background:repeating-radial-gradient(circle at 50% 50%, #17131c 0 3px, #241d29 3px 4px);
    box-shadow:0 5px 14px rgba(0,0,0,.28), inset 0 0 0 2px #2c2530;animation:spin 3.4s linear infinite}
  .vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(255,255,255,.16), transparent 22%, rgba(255,255,255,.09) 50%, transparent 74%, rgba(255,255,255,.16))}
  .vinyl .label{position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #ff7ab0, #ed1a78 60%, #c60f63);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .vinyl .label::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
  .arm{position:absolute;top:0;right:4px;pointer-events:none;z-index:3}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vinyl.playing{animation:spin 3.2s linear infinite}
  .playbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;width:34px;height:34px;border-radius:50%;border:0;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(198,15,99,.4);cursor:pointer;transition:transform .12s}
  .playbtn:hover{transform:translate(-50%,-50%) scale(1.08)}
  .playbtn svg{width:16px;height:16px;fill:currentColor}
  .spopen{display:block;text-align:center;font-size:10.5px;font-weight:600;color:var(--pink-deep);text-decoration:none;padding:5px 0 1px}
  .spopen:hover{text-decoration:underline}
  .player iframe{width:100%;border:0;border-radius:11px;display:block}
  .side .foot{margin-top:12px;font-size:10.5px;color:var(--ink-soft);line-height:1.55;padding:12px 10px 0;background:rgba(247,241,232,.6);border-radius:12px}

  /* ---- Main ---- */
  .main{padding:30px 38px 60px;max-width:1200px}
  .hero{position:relative;margin:4px 0 26px}
  .hero .ticks{position:absolute;left:-2px;top:-18px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.02;margin:0;letter-spacing:-.01em;position:relative;display:inline-block}
  .hero h1 .swash{position:absolute;left:0;right:-4px;bottom:-12px;height:16px}
  .hero p{margin:16px 0 0;color:var(--ink-soft);font-size:15px;font-weight:500}
  .spark{position:absolute;pointer-events:none}

  .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .head .eyebrow{margin-bottom:3px}
  .head h2{font-family:var(--serif);margin:0;font-size:25px;font-weight:600;letter-spacing:-.01em}

  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  .stat{flex:1;min-width:104px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:7px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .stat.due{background:linear-gradient(135deg,var(--pink),#ff5aa0);border:0;color:#fff}
  .stat.due .n{color:#fff} .stat.due .l{color:rgba(255,255,255,.85)}

  .bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}

function parseCSV(text){ const rows=[]; let i=0,field="",row=[],inQ=false; text=text.replace(/^﻿/,"");
  while(i<text.length){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=c; }
    else { if(c==='"') inQ=true; else if(c===",") { row.push(field); field=""; } else if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; } else if(c==="\r"){} else field+=c; }
    i++; }
  if(field.length||row.length){ row.push(field); rows.push(row); } return rows; }
function csvToLeads(text){ const rows=parseCSV(text).filter(r=>r.some(c=>(c||"").trim()!=="")); if(!rows.length) return [];
  const header=rows[0].map(h=>(h||"").trim().toLowerCase());
  const find=(re)=>header.findIndex(h=>re.test(h));
  const iPhone=find(/phone|mobile|cell|tel/),iEmail=find(/e-?mail/),iName=find(/^name$|full ?name|contact ?name/),iFirst=find(/first/),iLast=find(/last/),iCity=find(/city|town/),iState=find(/state|province|region/),iInterest=find(/service|interest|campaign|inquiry|procedure|treatment|reason|lead ?source|form ?name/);
  const out=[]; for(let r=1;r<rows.length;r++){ const row=rows[r]; const g=(i)=> i>=0?(row[i]||"").trim():"";
    let name=g(iName); if(!name){ name=(g(iFirst)+" "+g(iLast)).trim(); }
    out.push({name:name||null,phone:g(iPhone)||null,email:g(iEmail)||null,city:g(iCity)||null,state:g(iState)||null,interest:g(iInterest)||null}); }

  function renderStats(){
    const t=state.convThreads;

      {t:"No-response follow-up",d:"Nudges leads who go quiet, on a polite 0/2/4-day cadence.",on:true,kind:"info"},
      {t:"Appointment reminders",d:"Sends 24-hour and 2-hour reminders before each booking.",on:!!c.reminders_enabled,kind:"toggle",key:"reminders_enabled"},
      {t:"Missed appointment",d:"Reaches out to rebook after a no-show.",on:!!c.reminders_enabled,kind:"tie"},
      {t:"Long-term nurture",d:"Monthly check-ins for leads not ready yet.",on:false,kind:"soon"},
      {t:"Human handoff",d:"Alerts you for angry, legal, medical, or uncertain replies. Always on.",on:true,kind:"safety"},
    ];
    $("#auGrid").innerHTML=cards.map((k,i)=>`
      <div class="auto-card ${k.on?"":"is-off"}" data-i="${i}">
        <div class="auto-card-h"><span class="auto-t">${k.t}</span>${
          k.kind==="toggle"?`<button class="auto-sw ${k.on?"on":""}" data-key="${k.key}"><span></span></button>`
          :k.kind==="soon"?`<span class="auto-badge soon">Coming soon</span>`
          :k.kind==="mode"?`<span class="auto-badge on">${k.state}</span>`
          :pill(k.on)}</div>
        <p class="auto-d">${k.d}</p>
      </div>`).join("");
    document.querySelectorAll("#auGrid .auto-sw").forEach(sw=>sw.onclick=async()=>{
      const c=curClient(); const next=c.reminders_enabled?0:1;
      try{ await setSetting({reminders_enabled:next}); drawGrid(); toast(next?"Reminders on.":"Reminders off."); }catch(e){ alert(e.message); }
    });
  }
  drawGrid();

  // Enroll
  $("#auEnroll").innerHTML=`
    <h4>Enroll leads into the follow-up sequence</h4>
    <p class="muted" style="margin:2px 0 10px">Creates a conversation for each lead with a phone number and drops the first message in as a <b>draft</b> to review — enrolling never auto-sends, even in Autonomous mode.</p>
    <div class="enroll-warn">⚠ Compliance: only text people who agreed to hear from you. Cold-texting scraped businesses can violate TCPA / DNC / CAN-SPAM. These are <b>${esc(state.convClient)}</b>'s leads — make sure there's consent.</div>
    <div class="enroll-row">
      <input id="auEnrollLimit" type="number" min="1" max="500" value="50" title="How many leads">
      <button class="btn" id="auEnrollGo">Enroll leads with a phone</button>
    </div>
    <div id="auEnrollResult" style="margin-top:8px"></div>`;
  $("#auEnrollGo").onclick=async()=>{
    const lim=parseInt($("#auEnrollLimit").value,10)||50;
    if(!confirm("Enroll up to "+lim+" leads into the sequence? First message will be a draft for your review."))return;
    const box=$("#auEnrollResult"); box.innerHTML=`<p class="muted">Enrolling…</p>`;
    try{ const r=await api("/tenant/"+state.convClient+"/enroll",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({all:true,limit:lim})});
      box.innerHTML=`<div class="result">Enrolled ${r.enrolled} · ${r.skipped_existing} already in · ${r.skipped_no_phone} no phone · ${r.skipped_optout} opted out (of ${r.considered} considered). Drafts are waiting in Conversations.</div>`;
      toast("Enrolled "+r.enrolled+" leads."); }
    catch(e){ box.innerHTML=`<div class="result">${esc(e.message)}</div>`; }
  };

  // Connection check
  try{ const st=await api("/status"); const c=st.checks||{};
    const label={DB:"D1 database (DB binding)",ANTHROPIC_API_KEY:"AI · Anthropic key",TWILIO_ACCOUNT_SID:"Twilio · account SID",TWILIO_AUTH_TOKEN:"Twilio · auth token",CRON_KEY:"Cron key",GOOGLE_CLIENT_ID:"Google Calendar · client ID",GOOGLE_CLIENT_SECRET:"Google Calendar · secret",RESEND_API_KEY:"Email · Resend key",FROM_EMAIL:"Email · from address"};
    const order=["DB","ANTHROPIC_API_KEY","TWILIO_ACCOUNT_SID","TWILIO_AUTH_TOKEN","CRON_KEY","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","RESEND_API_KEY","FROM_EMAIL"];
    $("#auStatusBody").innerHTML=`<div class="status-grid">${order.map(k=>`<div class="status-row"><span class="status-dot ${c[k]?"ok":"no"}"></span>${label[k]||k}${c[k]?"":` <span class="status-miss">not set</span>`}</div>`).join("")}</div>`;
  }catch(e){ $("#auStatusBody").textContent="Couldn't load status: "+e.message; }

  // Recent activity
  try{ const ev=await api("/tenant/"+state.convClient+"/events");
    const rows=ev.events||[];
    $("#auActivity").innerHTML = rows.length ? rows.map(e=>{
      let det=""; try{ det=e.detail?JSON.stringify(JSON.parse(e.detail)):""; }catch{ det=e.detail||""; }
      return `<div class="auto-act"><span class="auto-kind">${esc(e.kind||"")}</span><span class="muted">${esc((det||"").slice(0,60))}</span><span class="auto-time">${esc(shortTime(e.created_at))}</span></div>`;
    }).join("") : `<p class="muted" style="margin:0">No activity yet — it fills in as the engine drafts, escalates, and books.</p>`;
  }catch(e){ $("#auActivity").innerHTML=`<p class="muted" style="margin:0">${esc(e.message)}</p>`; }
}

async function renderClientSetup(m, clientId){

      ${F("Legal name (on EIN)","cs_legal_name",c.legal_name)}

    <div class="cs-card"><h3>Business brain <span class="cs-hint">— the only facts the AI is allowed to state</span></h3>

        <select id="cs_tpl"><option value="">Choose an industry…</option>${BRAIN_TEMPLATES.map(t=>`<option value="${t.key}">${t.label}</option>`).join("")}</select></label>
      <label class="cs-f" style="margin-top:12px"><span>About</span><textarea id="cs_about" rows="2">${esc(brain.about||"")}</textarea></label>
      <div class="cs-sub">Services &amp; prices</div>
      <div id="cs_services"></div>
      <button class="btn ghost sm" id="cs_addService">+ Add service</button>

      <button class="btn ghost sm" id="cs_addAddon">+ Add add-on</button>
      <div class="cs-grid" style="margin-top:12px">

        <label class="cs-f"><span>Open until (hour, 0–23)</span><input id="cs_hend" type="number" min="0" max="23" value="${brain.booking_hours&&brain.booking_hours.end!=null?brain.booking_hours.end:17}"></label>
      </div>
      <div class="cs-sub">Days open</div>
      <div class="cs-days" id="cs_days">${[["1","Mon"],["2","Tue"],["3","Wed"],["4","Thu"],["5","Fri"],["6","Sat"],["7","Sun"]].map(([v,l])=>`<label class="cs-day"><input type="checkbox" value="${v}" ${days.has(Number(v))?"checked":""}><span>${l}</span></label>`).join("")}</div>
      <div class="cs-grid" style="margin-top:12px">${F("Location","cs_location",brain.location)}${F("Parking","cs_parking",brain.parking)}</div>

      <button class="btn ghost sm" id="cs_addStep">+ Add step</button>
    </div>

    <div class="cs-card"><h3>Client portal login <span class="cs-hint">— lets this client log in to see their reports (read-only)</span></h3>
      <div id="cs_logins" class="muted" style="margin-bottom:10px">Loading…</div>
      <div class="cs-grid">
        <label class="cs-f"><span>Email</span><input id="cs_lemail" type="email" placeholder="frontdesk@client.com"></label>
        <label class="cs-f"><span>Temporary password</span><input id="cs_lpass" placeholder="at least 8 characters"></label>
      </div>
      <button class="btn ghost sm" id="cs_addLogin" style="margin-top:10px">Create portal login</button>
    </div>

    <div class="cs-card"><h3>Import leads (CSV) <span class="cs-hint">— export from their CRM; a phone column is required</span></h3>
      <input type="file" id="cs_csv" accept=".csv,text/csv" class="cs-file">
      <div id="cs_csvInfo" class="muted" style="margin:8px 0"></div>
      <label class="cs-check"><input type="checkbox" id="cs_csvEnroll" checked> Start the reactivation sequence (drafts the first message for each — nothing sends without your approval)</label>
      <button class="btn" id="cs_csvGo" disabled style="margin-top:12px">Import leads</button>
      <div id="cs_csvResult" style="margin-top:8px"></div>
      <p class="muted" style="margin:10px 0 0;font-size:12px">⚠ Only import leads the client has consent to contact (TCPA/DNC). Duplicates and numbers already opted out are skipped automatically.</p>
    </div>

    <div class="cs-actions"><button class="btn" id="cs_save">Save client setup</button><span id="cs_msg" class="muted"></span></div>`;

  function drawServices(){
    $("#cs_services").innerHTML=services.length?services.map((s,i)=>`
      <div class="cs-row" data-i="${i}">
        <input data-k="name" value="${esc(s.name||"")}" placeholder="Service (e.g. Botox)">
        <input data-k="price" value="${esc(s.price||"")}" placeholder="$ price">
        <input data-k="duration" type="number" value="${esc(s.duration||"")}" placeholder="min" style="width:78px">
        <button class="cs-x" title="Remove">✕</button>
      </div>`).join(""):`<p class="muted" style="margin:4px 0">No services yet.</p>`;
    $("#cs_services").querySelectorAll(".cs-row").forEach(row=>{const i=Number(row.dataset.i);
      row.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{ services[i][inp.dataset.k]= inp.dataset.k==="duration"?(parseInt(inp.value,10)||null):inp.value; });
      row.querySelector(".cs-x").onclick=()=>{ services.splice(i,1); drawServices(); };});
  }
  function drawSequence(){
    $("#cs_sequence").innerHTML=sequence.length?sequence.map((s,i)=>`
      <div class="cs-seq" data-i="${i}"><span class="cs-seq-n">${i+1}</span><textarea rows="2">${esc(s)}</textarea><button class="cs-x" title="Remove">✕</button></div>`).join(""):`<p class="muted" style="margin:4px 0">No steps yet — add your first follow-up.</p>`;
    $("#cs_sequence").querySelectorAll(".cs-seq").forEach(row=>{const i=Number(row.dataset.i);
      row.querySelector("textarea").oninput=(e)=>{ sequence[i]=e.target.value; };
      row.querySelector(".cs-x").onclick=()=>{ sequence.splice(i,1); drawSequence(); };});
  }
  function drawAddOns(){
    $("#cs_addons").innerHTML=addOns.length?addOns.map((s,i)=>`
      <div class="cs-row" data-i="${i}">
        <input data-k="name" value="${esc(s.name||"")}" placeholder="Add-on (e.g. Brow wax)">
        <input data-k="price" value="${esc(s.price||"")}" placeholder="$ price">
        <button class="cs-x" title="Remove">✕</button>
      </div>`).join(""):`<p class="muted" style="margin:4px 0">No add-ons.</p>`;
    $("#cs_addons").querySelectorAll(".cs-row").forEach(row=>{const i=Number(row.dataset.i);
      row.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{ addOns[i][inp.dataset.k]=inp.value; });
      row.querySelector(".cs-x").onclick=()=>{ addOns.splice(i,1); drawAddOns(); };});
  }
  drawServices(); drawAddOns(); drawSequence();
  $("#cs_addService").onclick=()=>{ services.push({name:"",price:"",duration:null}); drawServices(); };
  $("#cs_addAddon").onclick=()=>{ addOns.push({name:"",price:""}); drawAddOns(); };
  $("#cs_addStep").onclick=()=>{ sequence.push("Hi {first_name}, this is {business}. Reply STOP to opt out."); drawSequence(); };
  function applyTemplate(t){ const tb=t.brain;
    $("#cs_tone").value=tb.tone||"";
    if(tb.booking_hours){ $("#cs_hstart").value=tb.booking_hours.start; $("#cs_hend").value=tb.booking_hours.end; }
    $("#cs_never").value=(tb.never_say||[]).join("\n");
    $("#cs_escalate").value=(tb.escalate_if||[]).join("\n");
    services=(tb.services||[]).map(s=>({...s})); drawServices();
    addOns=(tb.add_ons||[]).map(s=>({...s})); drawAddOns();

  async function loadLogins(){

      $("#cs_logins").innerHTML= mine.length? mine.map(u=>`<div class="cs-login"><span>${esc(u.email)}</span><button class="cs-x" data-uid="${u.id}" title="Remove">✕</button></div>`).join("") : "No portal logins yet.";

  $("#cs_addLogin").onclick=async()=>{

    try{ await api("/auth/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email,password,role:"client",client_id:clientId})});
      $("#cs_lemail").value=""; $("#cs_lpass").value=""; toast("Portal login created."); loadLogins(); }

  let csvLeads=[];
  $("#cs_csv").onchange=(e)=>{

    $("#cs_csvInfo").textContent="Reading file…";
    const rd=new FileReader();
    rd.onload=()=>{ try{ csvLeads=csvToLeads(rd.result); const withPhone=csvLeads.filter(l=>l.phone).length;
      $("#cs_csvInfo").innerHTML=`Found <b>${csvLeads.length.toLocaleString()}</b> row${csvLeads.length===1?"":"s"} · <b>${withPhone.toLocaleString()}</b> with a phone number${withPhone?" — imported in safe batches.":" — check that your file has a phone/mobile column."}`;
      $("#cs_csvGo").disabled=!withPhone;
    }catch(ex){ $("#cs_csvInfo").textContent="Couldn't read that file: "+ex.message; $("#cs_csvGo").disabled=true; } };
    rd.readAsText(file);
  };
  $("#cs_csvGo").onclick=async()=>{
    const enroll=$("#cs_csvEnroll").checked; const box=$("#cs_csvResult"); const btn=$("#cs_csvGo");
    const valid=csvLeads.filter(l=>l.phone); const noPhone=csvLeads.length-valid.length;
    if(enroll && valid.length>500 && !confirm(`This will draft a first message for all ${valid.length.toLocaleString()} leads — a lot to review at once.\n\nTip: import WITHOUT enrolling, then enroll in controlled batches from Automations. Continue enrolling all?`)) return;
    btn.disabled=true;
    const CHUNK=enroll?120:300; const tot={imported:0,skipped_dupe:0,enrolled:0};
    try{
      for(let i=0;i<valid.length;i+=CHUNK){
        const batch=valid.slice(i,i+CHUNK);
        box.innerHTML=`<p class="muted">Importing ${Math.min(i+CHUNK,valid.length).toLocaleString()} / ${valid.length.toLocaleString()}…</p>`;
        const r=await api("/tenant/"+clientId+"/import",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({leads:batch,enroll})});
        tot.imported+=r.imported||0; tot.skipped_dupe+=r.skipped_dupe||0; tot.enrolled+=r.enrolled||0;
      }
      box.innerHTML=`<div class="result">Imported ${tot.imported.toLocaleString()} · ${tot.skipped_dupe.toLocaleString()} already there${noPhone?` · ${noPhone.toLocaleString()} skipped (no phone)`:""}.${enroll?` Enrolled ${tot.enrolled.toLocaleString()} — first messages drafted in Conversations.`:""}</div>`;
      toast("Imported "+tot.imported.toLocaleString()+" leads.");
    }catch(e){ box.innerHTML=`<div class="result">Stopped after ${tot.imported.toLocaleString()} imported — ${esc(e.message)}. Re-importing the same file is safe (duplicates skip).</div>`; }
    finally{ btn.disabled=false; }
  };

  $("#cs_save").onclick=async()=>{
    const selDays=[...document.querySelectorAll("#cs_days input:checked")].map(i=>Number(i.value));
    const brainOut={
      about:$("#cs_about").value.trim()||undefined,
      services:services.filter(s=>s.name),
      add_ons:addOns.filter(a=>a.name),
      booking_hours:{start:parseInt($("#cs_hstart").value,10)||9,end:parseInt($("#cs_hend").value,10)||17},
      booking_days:selDays,
      location:$("#cs_location").value.trim()||undefined,
      parking:$("#cs_parking").value.trim()||undefined,
      tone:$("#cs_tone").value.trim()||undefined,
      never_say:$("#cs_never").value.split("\n").map(x=>x.trim()).filter(Boolean),
      escalate_if:$("#cs_escalate").value.split("\n").map(x=>x.trim()).filter(Boolean),
      sequence:sequence.map(x=>x.trim()).filter(Boolean),
    };
    const payload={ name:$("#cs_name").value.trim(), timezone:$("#cs_timezone").value.trim(), twilio_number:$("#cs_twilio_number").value.trim(),
      calendar_id:$("#cs_calendar_id").value.trim(), notify_email:$("#cs_notify_email").value.trim(), hot_lead_phone:$("#cs_hot_lead_phone").value.trim(),
      website:$("#cs_website").value.trim(), legal_name:$("#cs_legal_name").value.trim(), ein:$("#cs_ein").value.trim(), address:$("#cs_address").value.trim(),
      business_brain:brainOut };
    const btn=$("#cs_save"); btn.disabled=true; $("#cs_msg").textContent="Saving…";
    try{ await api("/tenant/"+clientId+"/profile",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
      $("#cs_msg").textContent="Saved ✓"; toast("Client setup saved."); state.convClients=[]; }
    catch(e){ $("#cs_msg").textContent=e.message; }
    finally{ btn.disabled=false; }
  };
}

  const NOTES={
    osm:"Only named businesses come in, and duplicates are skipped automatically. Coverage depends on what's mapped in OpenStreetMap — busy metros return the most. This finds businesses; it doesn't check licensing or consent to contact.",
    google:"Google Maps gives you phone, website, rating and review count on most listings, so it's the richest source — but every search spends a SerpApi credit. Duplicates are skipped automatically. This finds businesses; it doesn't check licensing or consent to contact.",
    yelp:"Yelp returns rating and review count and over-indexes on review-heavy businesses — handy for spotting the busy players. It doesn't include the business's own website, so enrichment can't scan Yelp-only leads. Every search spends a SerpApi credit; duplicates are skipped."
  };
  const VNOTES={
    osm:"OpenStreetMap only covers the four skilled trades. Switch to Google Maps or Yelp to search med spas, dental implants and windows.",
    google:"Med spa and dental implant runs sweep several search terms each, so they cost a few credits per city — watch the estimate below.",
    yelp:""
  };
  const src=()=>document.querySelector('#srcPick input:checked').value;
  const isCredit=()=>src()!=="osm";

  function readSel(){
    document.querySelectorAll("#checks input").forEach(cb=>{ if(cb.checked)SEL.add(cb.value); else SEL.delete(cb.value); });
  }
  function wireChecks(){
    document.querySelectorAll("#checks .check").forEach(c=>{const cb=c.querySelector("input");
      if(cb.disabled){ c.onclick=null; return; }
      c.onclick=(e)=>{ if(e.target!==cb)cb.checked=!cb.checked; c.classList.toggle("on",cb.checked); readSel(); cost(); };});
  }
  function renderChecks(){
    if(src()==="osm") VERTICALS.forEach(v=>{ if(!v.osm) SEL.delete(v.key); }); // prune hidden picks
    $("#checks").innerHTML=vertHTML(src());
    $("#vNote").textContent=VNOTES[src()]||"";
    wireChecks();
  }
  function sync(){
    document.querySelectorAll("#srcPick .check").forEach(c=>c.classList.toggle("on",c.dataset.src===src()));
    const credit=isCredit();
    $("#gWrap").style.display=credit?"":"none";
    $("#gDepth").style.display=credit?"":"none";
    $("#scNote").textContent=NOTES[src()];
    renderChecks();
    cost();
  }
  function cost(){
    if(!isCredit()){ $("#scCost").textContent=""; return; }
    const g=src()==="google";
    const chosen=[...document.querySelectorAll("#checks input:checked")].map(i=>i.value);
    const c=$("#scCities").value.split(",").map(s=>s.trim()).filter(Boolean).length;
    const p=parseInt($("#scPages").value,10)||1;
    const per=g?chosen.reduce((a,k)=>a+(((VERTICALS.find(v=>v.key===k)||{}).phrases)||1),0):chosen.length;
    const n=per*c*p;
    $("#scCost").textContent=n?`This run costs about ${n} SerpApi search${n===1?"":"es"}.`:"";
  }

  document.querySelectorAll("#srcPick .check").forEach(c=>{const rb=c.querySelector("input");
    c.onclick=()=>{ rb.checked=true; sync(); };});
  $("#scCities").oninput=cost;
  $("#scPages").onchange=cost;
  sync();

  $("#scGo").onclick=async()=>{
    readSel();
    const trades=[...SEL];
    const stateName=$("#scState").value; const box=$("#scResult"); const credit=isCredit(); const s=src();
    if(!trades.length){box.innerHTML=`<div class="result">Pick at least one vertical.</div>`;return;}
    if(!stateName){box.innerHTML=`<div class="result">Choose a state.</div>`;return;}
    const cities=$("#scCities").value;
    if(credit&&!cities.split(",").map(x=>x.trim()).filter(Boolean).length){
      box.innerHTML=`<div class="result">Name at least one city to search.</div>`;return;}

    const btn=$("#scGo"); btn.disabled=true; const orig=btn.textContent;
    btn.innerHTML=`<span class="spin"></span>Searching ${esc(stateName)}…`;
    box.innerHTML=`<p class="muted">${credit?"Asking "+(s==="google"?"Google Maps":"Yelp")+" through SerpApi — a few seconds per city.":"Querying OpenStreetMap — a statewide search can take up to a minute."}</p>`;
    try{
      const path=s==="google"?"/scrape-google":s==="yelp"?"/scrape-yelp":"/scrape";
      const body=credit
        ? {trades,state:stateName,cities,pages:parseInt($("#scPages").value,10)||1}
        : {trades,state:stateName};
      const r=await api(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      let msg=`Added ${r.inserted} new lead${r.inserted===1?"":"s"} from ${esc(stateName)} · ${r.found} found · ${r.skipped} skipped.`;
      if(credit) msg+=` ${r.searches} credit${r.searches===1?"":"s"} used.`;
      box.innerHTML=`<div class="result">${msg}</div>`
        + ((r.problems&&r.problems.length)?`<p class="muted">${r.problems.map(esc).join("<br>")}</p>`:"");
    }catch(e){ box.innerHTML=`<div class="result">${esc(e.message)}</div>`; }
    finally{ btn.disabled=false; btn.textContent=orig; loadStats(); }
  };

  // Website enrichment — loops batches until the queue is drained (bounded).
  $("#enGo").onclick=async()=>{
    const btn=$("#enGo"); const box=$("#enResult");
    btn.disabled=true; const orig=btn.textContent; btn.innerHTML=`<span class="spin"></span>Scanning…`;
    let processed=0, flagged=0, rounds=0;
    try{
      while(rounds<60){
        const r=await api("/enrich",{method:"POST",headers:{"content-type":"application/json"},body:"{}"});
        processed+=r.processed||0; flagged+=r.flagged||0; rounds++;
        box.innerHTML=`<div class="result">Scanned ${processed} site${processed===1?"":"s"} · ${flagged} with signals · ${r.remaining} left.</div>`
          + ((r.problems&&r.problems.length)?`<p class="muted">${r.problems.slice(0,6).map(esc).join("<br>")}</p>`:"");
        if(!r.processed || !r.remaining) break;
      }
      if(!processed) box.innerHTML=`<div class="result">No lead websites left to scan. Pull in some Google Maps leads first.</div>`;
    }catch(e){ box.innerHTML=`<div class="result">${esc(e.message)}</div>`; }
    finally{ btn.disabled=false; btn.textContent=orig; }
  };
}

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
// ---- Spotify record player: Web Playback SDK (full songs on Premium, no browser login) with embed fallback ----
const _pid=(SPOTIFY_PLAYLIST||"").trim();
const PLAY_SVG='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_SVG='<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
let spController=null,_player=null,_dev=null;
function setPlaying(p){const b=document.getElementById("playBtn"),v=document.getElementById("vinyl");
  if(v)v.classList.toggle("playing",p);
  if(b){b.innerHTML=p?PAUSE_SVG:PLAY_SVG;b.setAttribute("aria-label",p?"Pause":"Play");}}
const _spOpen=document.getElementById("spOpen"); if(_spOpen&&_pid)_spOpen.href="https://open.spotify.com/playlist/"+_pid;
async function getToken(){try{const r=await fetch("/api/spotify-token");if(!r.ok)return null;const d=await r.json();return d.access_token||null;}catch(e){return null;}}
window.onSpotifyIframeApiReady=(A)=>{window._IFrameAPI=A;if(window._useEmbed)buildEmbed();};
function buildEmbed(){const el=document.getElementById("spf");if(!el||!_pid||!window._IFrameAPI||spController)return;
  window._IFrameAPI.createController(el,{uri:"spotify:playlist:"+_pid,width:"100%",height:152},(c)=>{spController=c;c.addListener("playback_update",(e)=>setPlaying(!(e&&e.data&&e.data.isPaused)));});}
function loadSDK(){window.onSpotifyWebPlaybackSDKReady=()=>{
  _player=new Spotify.Player({name:"Ariana is Working \u2014 CRM",volume:0.6,getOAuthToken:cb=>{getToken().then(t=>t&&cb(t));}});
  _player.addListener("ready",({device_id})=>{_dev=device_id;});
  _player.addListener("not_ready",()=>{_dev=null;});
  _player.addListener("player_state_changed",(s)=>{setPlaying(!!s&&!s.paused);});
  _player.addListener("account_error",()=>{});
  _player.connect();};
  const sc=document.createElement("script");sc.src="https://sdk.scdn.co/spotify-player.js";sc.async=true;document.body.appendChild(sc);}
async function togglePlayback(){
  if(_player){try{await _player.activateElement();}catch(e){}
    const st=await _player.getCurrentState();
    if(!st){if(!_dev){await new Promise(r=>setTimeout(r,700));}const t=await getToken();
      if(t&&_dev){await fetch("https://api.spotify.com/v1/me/player/play?device_id="+_dev,{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({context_uri:"spotify:playlist:"+_pid})});}
    }else{_player.togglePlay();}return;}
  if(spController)spController.togglePlay();}
(function(){const b=document.getElementById("playBtn"),v=document.getElementById("vinyl");
  if(b)b.onclick=togglePlayback;
  if(v)v.onclick=(e)=>{if(!e.target.closest(".playbtn"))togglePlayback();};})();
(async function(){const t=await getToken();if(t){loadSDK();}else{window._useEmbed=true;if(window._IFrameAPI)buildEmbed();}})();

// ---- Auth gate ----
async function authMe(){ try{ const r=await fetch("/api/auth/me"); const d=await r.json().catch(()=>({})); return {status:r.status, ...d}; }catch(e){ return {authenticated:false}; } }
function authScreen(mode){
  const isBoot=mode==="bootstrap";
  document.body.insertAdjacentHTML("beforeend", `
    <div id="authScreen"><form id="authForm" class="auth-card">
      <div class="auth-logo">ARIANA IS WORKING · CRM</div>
      <h2>${isBoot?"Create your admin login":"Sign in"}</h2>
      <p class="muted" style="margin:0 0 4px">${isBoot?"This first account becomes your team admin.":"Team & client access."}</p>
      ${isBoot?`<input id="authName" placeholder="Your name">`:""}
      <input id="authEmail" type="email" placeholder="Email" autocomplete="username" required>
      <input id="authPass" type="password" placeholder="Password" autocomplete="${isBoot?"new-password":"current-password"}" required>
      <button class="btn" type="submit">${isBoot?"Create admin":"Sign in"}</button>
      <div id="authErr" class="auth-err"></div>
    </form></div>`);
  document.body.classList.add("noapp");
  document.getElementById("authForm").onsubmit=async(e)=>{
    e.preventDefault();
    const email=document.getElementById("authEmail").value.trim(), password=document.getElementById("authPass").value;
    const name=isBoot?document.getElementById("authName").value.trim():undefined;
    const err=document.getElementById("authErr"); err.textContent="Working…";
    try{ const r=await fetch("/api/auth/"+(isBoot?"bootstrap":"login"),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email,password,name})});
      const d=await r.json().catch(()=>({})); if(!r.ok){ err.textContent=d.error||"Sign-in failed."; return; } location.reload();
    }catch(ex){ err.textContent=ex.message; }
  };
}
function installLogout(){
  const nav=document.getElementById("nav");
  const anchor=nav||document.querySelector(".side .logo")||document.querySelector(".side");
  if(anchor && !document.getElementById("logoutBtn")){
    const who=window.ME?(window.ME.name||window.ME.email||""):"";
    anchor.insertAdjacentHTML("afterend", `<div class="who"><span>${esc(who)}</span><button id="logoutBtn" class="btn ghost sm">Log out</button></div>`);
    document.getElementById("logoutBtn").onclick=async()=>{ await fetch("/api/auth/logout",{method:"POST"}); location.reload(); };
  }
}
async function renderClientPortal(){
  const cid=window.ME.client_id; const m=$("#view");
  m.innerHTML=`<div id="cpWrap"><p class="muted">Loading your reports…</p></div>`;
  let stats={},threads=[],events=[],cinfo={};
  try{ stats=await api("/tenant/"+cid+"/stats"); }catch(e){}
  try{ const inb=await api("/tenant/"+cid+"/inbox"); threads=inb.threads||[]; cinfo=inb.client||{}; }catch(e){}
  try{ const ev=await api("/tenant/"+cid+"/events"); events=ev.events||[]; }catch(e){}
  const bizName=cinfo.name||"Your business";
  const side=document.querySelector(".side");
  if(side && !document.getElementById("portalBrand"))
    side.insertAdjacentHTML("afterbegin", `<div id="portalBrand" class="portal-brand">${esc(bizName)}<span>Client Portal</span><div class="portal-nav"><div class="pn-item on">Dashboard</div></div></div>`);
  const hero=document.getElementById("hero"); if(hero) hero.innerHTML=`<h1 style="margin:0">Your results</h1><p style="color:var(--ink-soft);margin:6px 0 0">Live reporting${cinfo.name?" for "+esc(cinfo.name):""}.</p>`;
  const f=stats.funnel||{}; const led=stats.daily||[];
  const sent=led.reduce((a,d)=>a+(d.sent||0),0), recv=led.reduce((a,d)=>a+(d.received||0),0), booked=led.reduce((a,d)=>a+(d.booked||0),0);
  const replyRate=sent?Math.round((recv/sent)*100):0;
  $("#cpWrap").innerHTML=`
    <div class="stats cv-stats">
      <div class="stat"><div class="n">${f.total||threads.length||0}</div><div class="l">Conversations</div></div>
      <div class="stat"><div class="n">${f.booked||booked||0}</div><div class="l">Appointments</div></div>
      <div class="stat"><div class="n">${replyRate}%</div><div class="l">Reply rate</div></div>
      <div class="stat"><div class="n">${sent}</div><div class="l">Messages sent</div></div>
    </div>
    <div class="cv-card" style="margin-top:16px"><h4>Recent activity</h4><div>${events.length?events.map(e=>`<div class="auto-act"><span class="auto-kind">${esc(e.kind||"")}</span><span class="auto-time">${esc(shortTime(e.created_at))}</span></div>`).join(""):`<p class="muted" style="margin:0">No activity yet.</p>`}</div></div>`;
}
async function boot(){
  const me=await authMe();
  if(me.needsBootstrap){ authScreen("bootstrap"); return; }
  if(!me.authenticated){ authScreen("login"); return; }
  window.ME=me.user; installLogout();
  if(me.user.role==="client"){ document.body.classList.add("portal"); return renderClientPortal(); }
  renderHero(); render();
}
boot();
