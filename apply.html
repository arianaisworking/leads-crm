<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Application</title>
<style>
  :root{--bg:#f4f6f9;--panel:#fff;--ink:#1f2733;--soft:#5b6472;--line:#e3e8ef;--brand:#2f6fed;--brand-wash:#eef3fe;--ok:#1f9d6b;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 130px}
  .top,.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .top h1{margin:0 0 6px;font-size:23px;line-height:1.25}
  .top .sub{color:var(--soft);font-size:14px}
  .badge{display:inline-block;background:var(--brand-wash);color:var(--brand);font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;margin-bottom:11px;letter-spacing:.04em;text-transform:uppercase}
  .sec h2{margin:0 0 4px;font-size:17px}
  .sec .note{color:var(--soft);font-size:13.5px;margin:0 0 16px}
  .f{margin-bottom:15px}
  .f>label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .f .hint{font-weight:400;color:var(--soft);font-size:12.5px;display:block;margin-top:2px}
  .f input,.f textarea,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff;color:var(--ink)}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .f textarea{min-height:80px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .yn{display:flex;gap:9px}
  .yn button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;color:var(--soft)}
  .yn button.sel{border-color:var(--brand);background:var(--brand-wash);color:var(--brand)}
  .yn button.sel.no{border-color:#d99;background:#fdecec;color:#9b2c2c}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:14px;cursor:pointer;background:#fff;user-select:none}
  .chip.sel{border-color:var(--brand);background:var(--brand-wash);color:var(--brand);font-weight:600}
  /* Each ticket is its own small card. The violation names are long — giving
     the dropdown a full line means it stays readable on a phone, which is
     where most of these get filled in. */
  .vitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfe}
  .vitem select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
                font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .vitem .v2{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .vitem .v2 .lbl{font-size:13.5px;color:var(--soft);font-weight:600}
  .vitem .v2 input{flex:1;min-width:130px;padding:10px 11px;border:1px solid var(--line);
                   border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .vitem .x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;
            padding:9px 14px;cursor:pointer;color:var(--soft);font:inherit;font-size:13.5px;font-weight:600}
  .vitem .x:hover{border-color:#d99;color:#9b2c2c}
  .addv{border:1px dashed var(--line);background:#fbfcfe;color:var(--brand);border-radius:11px;padding:11px;width:100%;font:inherit;font-weight:600;cursor:pointer}
  .consent{background:#fbfcfe;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:13px;color:var(--soft);line-height:1.55;margin-bottom:13px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:center;box-shadow:0 -2px 12px rgba(20,22,40,.06)}
  .bar .inner{max-width:720px;width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px 26px;font:inherit;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.55}
  .prog{font-size:13px;color:var(--soft)}
  .msg{text-align:center;padding:52px 22px}
  .check{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
  .err{background:#fdecec;border:1px solid #f5c2c2;color:#9b2c2c;border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:none}
  .req{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--soft);margin-bottom:7px}
  .req b{color:var(--ink);font-weight:600}
  .tick{color:var(--ok);font-weight:700}
  /* Language toggle — sticky so it's reachable from anywhere in a long form. */
  .lang{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;gap:2px;
        padding:8px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
  .lang button{border:1px solid var(--line);background:#fff;color:var(--soft);font:inherit;
               font-size:13px;font-weight:700;padding:6px 13px;cursor:pointer}
  .lang button:first-of-type{border-radius:9px 0 0 9px}
  .lang button:last-of-type{border-radius:0 9px 9px 0;border-left:0}
  .lang button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  @media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

  /* ---- Touch sizing. Drivers are on phones, not desktops. ----
     16px on form controls: below that, iOS zooms the page the moment a field is
     focused, which throws the layout around mid-answer.
     44px minimum on tap targets: Apple's guideline, and about right for a thumb. */
  input,select,textarea,button{font-size:16px}
  .lang button{min-height:44px;padding-left:16px;padding-right:16px}
  .yn button{min-height:48px}
  .chip{min-height:44px}
  .btn{min-height:48px}
  .f input,.f select,.f textarea{font-size:16px;min-height:48px}
  .vitem select,.vitem .v2 input{font-size:16px;min-height:48px}
  .vitem .x{min-height:44px}
  .addv{min-height:48px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="top"><div class="sub">Loading…</div></div></div>
<div class="bar" id="bar" style="display:none"><div class="inner">
  <span class="prog" id="prog"></span>
  <button class="btn" id="submitBtn">Submit</button>
</div></div>

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let CHART=[], DATA=null;

const T={
 en:{

let lang=(navigator.language||"en").toLowerCase().startsWith("es")?"es":"en";
try{ const s=localStorage.getItem("tt_lang"); if(s) lang=s; }catch(e){}
const t=(k,vars)=>{ let v=(T[lang]&&T[lang][k])||T.en[k]||""; if(vars) for(const [a,b] of Object.entries(vars)) v=v.split("{"+a+"}").join(b); return v; };

function ynField(key,label,hint){
  return `<div class="f"><label>${label}${hint?`<span class="hint">${hint}</span>`:""}</label>
    <div class="yn" data-yn="${key}">
      <button type="button" data-v="1">${t("yes")}</button>
      <button type="button" data-v="0">${t("no")}</button>
    </div></div>`;
}
function wireYN(root){
  root.querySelectorAll("[data-yn]").forEach(g=>{
    const key=g.dataset.yn;
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      A[key]=b.dataset.v==="1"?1:0;
      g.querySelectorAll("button").forEach(x=>x.classList.remove("sel","no"));
      b.classList.add("sel"); if(b.dataset.v==="0") b.classList.add("no");
      onChange();
    });
    if(A[key]!=null){ const b=g.querySelector(`[data-v="${A[key]}"]`); if(b){b.classList.add("sel"); if(A[key]===0)b.classList.add("no");} }
  });
}
function stateOpts(sel){ return `<option value="">${t("dash")}</option>`+STATES.map(s=>`<option${s===sel?" selected":""}>${s}</option>`).join(""); }
const vLabel=(c)=>(lang==="es"&&c.label_es)?c.label_es:c.label;

function violationRow(i){
  const v=A.violations[i]||{};
  const minor=CHART.filter(c=>c.group==="minor"), serious=CHART.filter(c=>c.group==="serious");
  const opt=c=>`<option value="${c.code}"${v.code===c.code?" selected":""}>${esc(vLabel(c))}</option>`;
  return `<div class="vitem" data-i="${i}">
    <select data-vf="code" aria-label="${t("v_what")}">
      <option value="">${t("v_what")}</option>
      <optgroup label="${t("v_g1")}">${minor.map(opt).join("")}</optgroup>
      <optgroup label="${t("v_g2")}">${serious.map(opt).join("")}</optgroup>
    </select>
    <div class="v2">
      <span class="lbl">${t("v_when")}</span>
      <input type="date" data-vf="date" value="${esc(v.date||"")}" aria-label="${t("v_when")}">
      <button type="button" class="x" data-del="${i}">${t("v_rm")}</button>
    </div>
  </div>`;
}
function drawViolations(){
  const box=$("#vlist"); if(!box)return;
  box.innerHTML=A.violations.map((_,i)=>violationRow(i)).join("")||`<p class="note" style="margin:0 0 10px">${t("v_none")}</p>`;
  box.querySelectorAll("[data-vf]").forEach(el=>el.onchange=()=>{
    const i=+el.closest(".vitem").dataset.i;
    A.violations[i][el.dataset.vf]=el.value; onChange();
  });
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ A.violations.splice(+b.dataset.del,1); drawViolations(); onChange(); });
}

function onChange(){
  const missing=[];
  if(!A.name) missing.push(t("need_name"));
  if(!A.phone) missing.push(t("need_phone"));
  const p=$("#prog");
  if(p) p.textContent = missing.length ? t("need",{list:missing.join(", ")}) : t("ready");
}

function render(){
  const d=DATA, c=d.carrier||{};
  const pf=d.prefill||{};
  // Only seed from the server the first time; a language switch must not wipe
  // what the driver has already typed.
  if(!A._seeded){ Object.assign(A,{name:pf.name||"",phone:pf.phone||"",email:pf.email||"",city:pf.city||"",state:pf.state||""}); A._seeded=1; }
  const trailer=c.needs_own_trailer?t("r_trailer_yes"):t("r_trailer_no");
  $("#wrap").innerHTML=`
  <div class="lang">
    <button data-lang="en" class="${lang==="en"?"on":""}">EN</button>
    <button data-lang="es" class="${lang==="es"?"on":""}">ES</button>
  </div>
  <div class="top">
    <div class="badge">${t("badge")}</div>
    <h1>${esc(t("h1",{carrier:c.name||""}))}</h1>
    <div class="sub">${c.driver_type==="owner_operator"?t("oo"):""}${c.haul_type?" · "+esc(c.haul_type):""}${[c.city,c.state].filter(Boolean).length?" · "+esc([c.city,c.state].filter(Boolean).join(", ")):""}</div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
      ${c.needs_own_truck?`<div class="req"><span class="tick">✓</span><div>${t("r_truck",{trailer})}</div></div>`:""}
      <div class="req"><span class="tick">✓</span><div>${t("r_cit")}</div></div>
      <div class="req"><span class="tick">✓</span><div>${t("r_mis")}</div></div>
      ${c.orientation_info?`<div class="req"><span class="tick">✓</span><div>${t("r_or",{info:esc(c.orientation_info)})}</div></div>`:""}
    </div>
  </div>

  <div class="err" id="err"></div>

  <div class="sec">
    <h2>${t("s1")}</h2><p class="note">${t("s1n")}</p>
    <div class="f"><label>${t("name")}</label><input id="f_name" value="${esc(A.name||"")}" autocomplete="name"></div>
    <div class="grid2">
      <div class="f"><label>${t("phone")}</label><input id="f_phone" type="tel" value="${esc(A.phone||"")}" autocomplete="tel"></div>
      <div class="f"><label>${t("email")}</label><input id="f_email" type="email" value="${esc(A.email||"")}" autocomplete="email"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>${t("city")}</label><input id="f_city" value="${esc(A.city||"")}"></div>
      <div class="f"><label>${t("state")}</label><select id="f_state">${stateOpts(A.state)}</select></div>
    </div>
    <div class="f"><label>${t("dob")}<span class="hint">${t("dob_h")}</span></label><input id="f_dob" type="date" value="${esc(A.dob||"")}"></div>
    ${ynField("work_authorized",t("work"),t("work_h"))}
  </div>

  <div class="sec">
    <h2>${t("s2")}</h2><p class="note">${t("s2n")}</p>
    <div class="grid3">
      <div class="f"><label>${t("cls")}</label><select id="f_cdl_class"><option value="">${t("dash")}</option>${["A","B","C"].map(x=>`<option${A.cdl_class===x?" selected":""}>${x}</option>`).join("")}</select></div>
      <div class="f"><label>${t("iss")}</label><select id="f_cdl_state">${stateOpts(A.cdl_state)}</select></div>
      <div class="f"><label>${t("exp")}</label><input id="f_cdl_expires" type="date" value="${esc(A.cdl_expires||"")}"></div>
    </div>
    <div class="f"><label>${t("end")}<span class="hint">${t("end_h")}</span></label>
      <div class="chips" id="endorse">${ENDORSE.map(([k,l])=>`<div class="chip${(A.endorsements||"").split(",").includes(k)?" sel":""}" data-e="${k}">${l}</div>`).join("")}</div>
    </div>
    <div class="f"><label>${t("med")}<span class="hint">${t("med_h")}</span></label><input id="f_dot_medical_expires" type="date" value="${esc(A.dot_medical_expires||"")}"></div>
  </div>

  <div class="sec">
    <h2>${t("s3")}</h2><p class="note">${t("s3n")}</p>
    <div class="grid2">
      <div class="f"><label>${t("e5")}<span class="hint">${t("e5_h")}</span></label><input id="f_exp_months_5yr" type="number" min="0" max="60" inputmode="numeric" value="${esc(A.exp_months_5yr||"")}"></div>
      <div class="f"><label>${t("e3")}<span class="hint">${t("e3_h")}</span></label><input id="f_exp_months_3yr" type="number" min="0" max="36" inputmode="numeric" value="${esc(A.exp_months_3yr||"")}"></div>
    </div>
    <div class="f"><label>${t("fb")}<span class="hint">${t("fb_h")}</span></label><input id="f_flatbed_months_1yr" type="number" min="0" max="12" inputmode="numeric" value="${esc(A.flatbed_months_1yr||"")}"></div>
    ${ynField("can_verify_employers",t("ver"),t("ver_h"))}
    ${ynField("has_1099s",t("t99"),t("t99_h"))}
  </div>

  <div class="sec">
    <h2>${t("s4")}</h2><p class="note">${t("s4n",{trailer:c.needs_own_trailer?"":t("s4n_tr")})}</p>
    ${ynField("owns_truck",t("owns"),"")}
    <div class="grid2">
      <div class="f"><label>${t("yr")}</label><input id="f_truck_year" type="number" inputmode="numeric" placeholder="2019" value="${esc(A.truck_year||"")}"></div>
      <div class="f"><label>${t("mk")}</label><input id="f_truck_make" placeholder="Freightliner" value="${esc(A.truck_make||"")}"></div>
    </div>
    <p class="note" style="margin:0">${t("s4_later")}</p>
  </div>

  <div class="sec">
    <h2>${t("s6")}</h2><p class="note">${t("s6n")}</p>
    <div id="vlist"></div>
    <button type="button" class="addv" id="addv">${t("v_add")}</button>
  </div>

  <div class="sec">
    <h2>${t("s7")}</h2><p class="note">${t("s7n")}</p>
    ${ynField("misdemeanor",t("mis"),t("mis_h"))}
    ${ynField("felony",t("fel"),t("fel_h"))}
    <div class="f"><label>${t("pos")}<span class="hint">${t("pos_h")}</span></label><input id="f_positive_test_at" type="date" value="${esc(A.positive_test_at||"")}"></div>
    <div class="f"><label>${t("sap")}<span class="hint">${t("sap_h")}</span></label><input id="f_sap_completed_at" type="date" value="${esc(A.sap_completed_at||"")}"></div>
    <div class="f"><label>${t("note")}<span class="hint">${t("note_h")}</span></label><textarea id="f_background_note">${esc(A.background_note||"")}</textarea></div>
  </div>

  <div class="sec"><div class="consent">${t("consent",{carrier:esc(c.name||"")})}</div></div>`;

  ["name","phone","email","city","state","dob","cdl_class","cdl_state","cdl_expires","dot_medical_expires",
   "exp_months_5yr","exp_months_3yr","flatbed_months_1yr","truck_year","truck_make",
   "positive_test_at","sap_completed_at","background_note"].forEach(k=>{
    const el=$("#f_"+k); if(!el)return;
    const set=()=>{A[k]=el.value;onChange();};
    el.oninput=set; el.onchange=set;
  });
  wireYN($("#wrap"));
  $("#endorse").querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    ch.classList.toggle("sel");
    A.endorsements=[...$("#endorse").querySelectorAll(".chip.sel")].map(x=>x.dataset.e).join(",");
  });
  $("#addv").onclick=()=>{ A.violations.push({code:"",date:""}); drawViolations(); };
  document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
    lang=b.dataset.lang;
    try{ localStorage.setItem("tt_lang",lang); }catch(e){}
    document.documentElement.lang=lang;
    render();                       // re-render in place; answers are kept in A
  });
  drawViolations(); onChange();
  $("#submitBtn").textContent=t("submit");
  $("#bar").style.display="flex";
  document.documentElement.lang=lang;
  document.title=t("badge");
}

function done(next){
  // A driver who cleared screening gets their next two links here and now.
  // Waiting on an email is how people fall out of the process.
  if(next && (next.carrier_app || next.lease)){
    const carrier=next.carrier||"";
    $("#wrap").innerHTML=`<div class="top" style="text-align:center">
        <div class="check">✓</div>
        <h1 style="margin:0 0 8px;font-size:22px">${t("nx_h")}</h1>
        <p style="color:var(--soft);margin:0">${t("nx_p")}</p>
      </div>
      ${next.carrier_app?`<div class="sec" style="border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.09)">
        <h2>${t("nx_1")}</h2>
        <p class="note">${t("nx_1p",{carrier:esc(carrier)})}</p>
        <a class="btn" href="${esc(next.carrier_app)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">${t("nx_1b")}</a>
      </div>`:""}
      ${next.lease?`<div class="sec">
        <h2>${t("nx_2")}</h2>
        <p class="note">${t("nx_2p")}</p>
        <a class="btn" href="${esc(next.lease)}" style="display:block;text-align:center;text-decoration:none;background:#fff;color:var(--brand);border:1px solid var(--brand)">${t("nx_2b")}</a>
      </div>`:""}
      <div class="sec"><p class="note" style="margin:0 0 8px">${t("nx_save")}</p>
        <p class="note" style="margin:0">${t("nx_conf")}</p></div>`;
  } else {
    $("#wrap").innerHTML=`<div class="top msg">
      <div class="check">✓</div>
      <h1 style="margin:0 0 8px;font-size:22px">${t("done_h")}</h1>
      <p style="color:var(--soft);margin:0 0 6px">${t("done_p1")}</p>
      <p style="color:var(--soft);margin:0;font-size:14px">${t("done_p2")}</p>
    </div>`;
  }
  $("#bar").style.display="none";
  window.scrollTo(0,0);
}

async function submit(){
  const err=$("#err");
  if(!A.name || !(A.phone||A.email)){
    err.textContent=t("err_req"); err.style.display="block"; window.scrollTo(0,0); return;
  }
  A.violations=A.violations.filter(v=>v.code);
  A.lang=lang;                      // so follow-ups reach them in their language
  const btn=$("#submitBtn"); btn.disabled=true; btn.textContent=t("sending");
  try{
    const r=await fetch("/api/apply/submit?"+Q,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(A)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||"Something went wrong. Please try again.");
    done(d.next);
  }catch(e){
    err.textContent=e.message; err.style.display="block"; window.scrollTo(0,0);
    btn.disabled=false; btn.textContent=t("submit");
  }
}

(async function(){
  try{
    const r=await fetch("/api/apply/form?"+Q);
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"This link isn't working.");
    CHART=d.chart||[]; DATA=d;
    if(d.submitted){ done(); return; }
    render();
    $("#submitBtn").onclick=submit;
  }catch(e){
    $("#wrap").innerHTML=`<div class="top msg"><h1 style="font-size:20px;margin:0 0 8px">${t("err_open")}</h1><p style="color:var(--soft);margin:0">${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
